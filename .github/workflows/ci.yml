name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies (incl. dev)
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check src tests

      - name: Mypy
        run: uv run mypy src

      # Integration tests start pgvector via testcontainers (Docker on the runner).
      - name: Pytest (non-live)
        run: uv run pytest -m "not live"

  node-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Relay tests (clients/node)
        run: npm test
        working-directory: clients/node

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Helm lint
        run: helm lint deploy/helm/vendorkb --set image.tag=sha-0000000

      - name: Helm template
        run: helm template v deploy/helm/vendorkb --set image.tag=sha-0000000
