- id: sv-c-01
  type: single_vendor
  question: As a Veeam Cloud Connect service provider, how can I publish disks from a tenant's backup
    to one of my servers, and does it work if the tenant's backups are encrypted?
  gold_facts:
  - The SP must use Veeam PowerShell cmdlets; disk publishing is not available in the SP Veeam backup
    console.
  - Disk publishing from encrypted tenant backups is supported only if the tenant has granted the SP restore
    access to all backups; otherwise only unencrypted backups are supported.
  - The tenant account must be disabled before publishing (and can be re-enabled after the publishing
    session is stopped).
  - Disks are published with the Publish-VBRBackupContent cmdlet, after getting the backup and restore
    point with Get-VBRCloudTenantBackup and Get-VBRCloudTenantRestorePoint.
  - Published disk content appears in the C:\VeeamFLR\ folder on the target server, read-only for Windows
    machine disks.
  gold_sources:
  - article_id: 1373f5df-6d3f-40d7-a08c-a8b891eaaddc
    section: Publishing Disks from Tenant Backups
  vendors:
  - Veeam
  written_from:
  - 1373f5df-6d3f-40d7-a08c-a8b891eaaddc
  decides: true
  origin: new
- id: sv-c-02
  type: single_vendor
  question: What are the requirements and restrictions for the staging SQL Server used by Veeam Explorer
    for Microsoft SQL Server? Can I use SQL Express or a clustered instance?
  gold_facts:
  - Any edition of Microsoft SQL Server can be used as the staging server, including Express Edition.
  - Databases larger than 10 GB cannot be attached to a SQL Server Express Edition instance.
  - The staging server must run the same SQL Server version as the source server, or a later one.
  - A SQL Server that is part of a failover cluster cannot be used as a staging server.
  - Using Availability Group Listeners as staging servers is not recommended.
  - The staging server can be in the same domain as the mount server, a trusted domain, or an untrusted
    domain.
  gold_sources:
  - article_id: 18a680cb-655e-4afb-a712-a38e46da662c
    section: Considerations and Limitations
  vendors:
  - Veeam
  written_from:
  - 18a680cb-655e-4afb-a712-a38e46da662c
  decides: true
  origin: new
- id: sv-c-03
  type: single_vendor
  question: What access does the Securiti.ai Zendesk Support (self-hosted) connector request, and do I
    have to configure granular per-object scopes in Zendesk?
  gold_facts:
  - The connector requests scope=read, i.e. read access to the Zendesk objects it uses.
