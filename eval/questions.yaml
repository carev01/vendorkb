  origin: new
- id: sv-a-08
  type: single_vendor
  question: How long can Azure Backup keep backups of Azure Database for MySQL Flexible Server compared
    with the built-in backups, and can I set up new protection for it right now?
  gold_facts:
  - Built-in Azure Database for MySQL Flexible Server backups are limited to 35 days of retention.
  - Azure Backup long-term retention keeps backups for up to 10 years.
  - The Azure Backup preview for MySQL Flexible Server is currently paused; new backups should not be
    configured.
  - Existing backup data remains safe and available for restore.
  - For backup, the vault MSI needs the MySQL Flexible Server Long-Term Retention Backup role and Reader
    on the server's resource group; restore needs Storage Blob Data Contributor on the target storage
    account.
  gold_sources:
  - article_id: 930631b4-92b3-4698-8d67-7197265ec8a3
  vendors:
  - Microsoft
  written_from:
  - 930631b4-92b3-4698-8d67-7197265ec8a3
  decides: true
  origin: new
- id: sv-a-09
  type: single_vendor
  question: When setting up Azure Backup for Azure Database for PostgreSQL databases in the portal, which
    servers and databases can I pick, and how does the vault get the database credentials?
  gold_facts:
  - The Backup vault must be in the same region as the PostgreSQL server; servers across subscriptions
    can be selected if they are in the vault's region.
  - The azure_maintenance and azure_sys databases do not need to be backed up.
  - A database already backed up to a Backup vault cannot be backed up again.
  - Credentials are supplied as a secret in Azure Key Vault (the PG server connection string in ADO.net
    format).
  - If you enter a secret URI, Azure Backup has no visibility of the key vault, so the vault's access
    on the key vault must be granted manually.
  gold_sources:
  - article_id: d2717708-ce2a-432e-8c06-3ad939c4103a
    section: Configure backup on the database
  vendors:
  - Microsoft
  written_from:
