- id: ex-rt-00
  type: multi_article
  question: How does a Veeam Backup & Replication hardened repository keep backups immutable?
  gold_facts:
  - A hardened repository is a Linux server; you specify an immutability period during which backup files
    cannot be moved, modified or deleted (but can be copied).
  - Single-use credentials are used only to deploy Veeam Data Mover and are not stored, so a compromised
    backup server cannot reach the repository.
  - The single-use SSH account must be a non-root user (remove it from sudoers after the server is added).
  - No other roles can be assigned to the hardened repository except a VMware backup proxy in Network
    mode.
  - Veeam Backup & Replication does not allow deleting immutable backups until the immutability expiration
    date.
  gold_sources:
