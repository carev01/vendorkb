  question: What do I need before booting Veeam Recovery Media to restore a Linux machine backed up with
    Veeam Agent for Linux, and which hypervisors can I restore to?
  gold_facts:
  - You need the recovery image on media (CD/DVD/BD or removable storage) set as the primary boot source.
  - You need a volume-level or file-level Veeam Agent for Linux backup that has been successfully created
    at least once.
  - For a backup on a Veeam backup repository you need access permissions on that repository.
  - For restore to a virtual environment, Veeam Recovery Media supports only VMware and Hyper-V.
  gold_sources:
