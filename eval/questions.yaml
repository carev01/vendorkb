- id: cv-11
  type: cross_vendor
  shape: comparison
  question: Can I bring my own encryption key to a Cohesity FortKnox vault and to an AWS Backup vault,
    and can I switch keys after the vault exists?
  gold_facts:
  - 'Cohesity: FortKnox offers Cohesity-managed KMS (AES-256 in CBC mode) or your own AWS KMS keys, and
    bring-your-own keys are available only for AWS vaults.'
  - 'Cohesity: the key management service cannot be changed once the cloud vault is created.'
  - 'AWS: an AWS Backup vault uses the default aws/backup KMS key or any other KMS key in your account
    (cross-account keys via the CLI).'
  - 'AWS: once the vault is created with its KMS key, the key can no longer be edited.'
  gold_sources:
