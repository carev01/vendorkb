- id: sv-c-04
  type: single_vendor
  question: With the Veeam Plug-in for Google Cloud in Veeam Backup & Replication, which guest file systems
    support file-level recovery, and what can't be restored to the original location?
  gold_facts:
  - File-level recovery supports only FAT, FAT32, NTFS, ext2, ext3, ext4, XFS and Btrfs.
  - Attributes of files and folders on FAT and FAT32 cannot be restored to the original location.
  - NTFS links (hard links, junction points, symbolic links) cannot be restored to the original location.
  - A disk shared between multiple VMs can be restored to only one of them as its original location; it
