- id: sv-a-01
  type: single_vendor
  question: Which tools can I use to keep an eye on AWS Backup jobs and API activity, and what do I use
    if the jobs dashboard isn't offered in my Region?
  gold_facts:
  - The AWS Backup jobs dashboard is available only in Regions where AWS Backup Audit Manager is supported;
    other Regions use the CloudWatch dashboard.
  - Amazon CloudWatch is used to track metrics, create alarms and view dashboards for AWS Backup.
  - Amazon EventBridge is used to view and monitor AWS Backup events.
  - AWS CloudTrail logs AWS Backup API calls, including time, source IP, users and accounts.
  - Amazon SNS can be used to subscribe to backup, restore and copy event notifications.
  gold_sources:
  - article_id: 2dcd7752-4401-48f3-895b-7330e497523e
    section: Monitoring AWS Backup
  vendors:
  - AWS
  written_from:
  - 2dcd7752-4401-48f3-895b-7330e497523e
  decides: true
  origin: new
- id: sv-a-02
  type: single_vendor
  question: My on-prem VMware backups to AWS Backup keep failing with "Abort signal detected". What bandwidth
    and backup gateway limits should I check, and how do I fix it?
  gold_facts:
  - AWS Backup needs at least 100 Mbps of bandwidth to AWS for on-premises VMware VM backups; below that
    the gateway cannot complete any backup or restore job.
  - A single backup gateway processes at most 4 backup/restore jobs at a time; additional jobs queue.
  - Queued jobs that have not started when the backup start window passes fail with 'abort signal detected'.
  - Remedies include increasing bandwidth (or the gateway bandwidth rate limit), adding backup gateways,
    and increasing the backup plan's complete-within window.
  gold_sources:
  - article_id: 44f38ffb-4c27-4383-b8b0-030a1476ea08
    section: VMware backup job failure
  vendors:
  - AWS
  written_from:
  - 44f38ffb-4c27-4383-b8b0-030a1476ea08
  decides: true
  origin: new
- id: sv-a-03
  type: single_vendor
  question: If I configure an AWS Backup plan rule to move backups to cold storage, what constraints apply
    to the retention and transition settings?
  gold_facts:
  - Backups transitioned to cold storage must stay there for a minimum of 90 days.
  - Total retention (DeleteAfterDays) must be at least 90 days more than the transition-to-cold setting.
  - The transition-to-cold setting cannot be changed after a backup has transitioned to cold storage.
  - AWS Backup recommends keeping backups in warm storage for at least 8 days (incremental backups need
    a warm full backup; transitioning too soon creates another warm full backup).
  gold_sources:
  - article_id: 554ebdbf-e818-43e8-9d1d-55fbd28a983b
    section: Lifecycle and storage tiers
  vendors:
  - AWS
  written_from:
  - 554ebdbf-e818-43e8-9d1d-55fbd28a983b
  decides: true
  origin: new
- id: sv-a-04
  type: single_vendor
  question: For accessing AWS Backup, what does AWS recommend doing with the root account, and when would
    an IAM role be used instead of an IAM user?
  gold_facts:
  - AWS recommends using the root user only to create an administrator IAM user with full permissions.
  - An IAM role is not associated with a specific person and provides temporary credentials.
  - IAM roles are used for federated user access, cross-account administration, granting an AWS service
    access, and applications running on EC2 instances.
  - For EC2 applications, an IAM role via an instance profile is preferable to storing access keys on
    the instance.
  gold_sources:
  - article_id: 95d1c25a-eea5-4bf3-88c4-b1203e84b5ab
    section: Authentication
  vendors:
  - AWS
  written_from:
  - 95d1c25a-eea5-4bf3-88c4-b1203e84b5ab
  decides: true
  origin: new
- id: sv-a-05
  type: single_vendor
  question: What time range does the AWS Backup jobs dashboard show, is today's job activity included,
    and which jobs does it count as problematic?
  gold_facts:
  - The jobs dashboard shows the latest 14 days by default and can be switched to 7 days.
  - It shows data up to the most recent 0:00 UTC; the current day's data is not included.
  - The dashboard updates daily at approximately 1:30-2:30 UTC.
  - A problematic job is one with status Failed, Expired, or Completed with issues.
  - The top problematic accounts view is visible only to accounts with Organizations access (management
    or delegated administrator accounts).
  gold_sources:
  - article_id: a2fd9f51-c998-4b55-91c0-877a9f18a0ab
    section: Backup dashboards overview
  vendors:
  - AWS
  written_from:
  - a2fd9f51-c998-4b55-91c0-877a9f18a0ab
  decides: true
  origin: new
- id: sv-a-06
  type: single_vendor
  question: With Azure Backup, can I restore an Azure Database for PostgreSQL Flexible Server backup over
    the original database, and how do I get the restored data into a server?
  gold_facts:
  - Original Location Recovery (OLR) is not supported for PaaS databases; Alternate-Location Recovery
    (ALR) is used instead.
  - A PostgreSQL Flexible Server recovery point can be restored as files only, to a storage account container.
  - The Backup vault's system-assigned managed identity needs access on the target storage account.
  - After the restore to storage, the pg_restore utility is used to restore the database into a Flexible
    Server.
  - The number of parallel pg_restore jobs (-j) can be equal to or less than the target server's vCPUs.
  gold_sources:
  - article_id: 2191df9b-c982-4637-9913-a7facd3cffbe
    section: Prepare the restore request for PostgreSQL - Flexible Server
  vendors:
  - Microsoft
  written_from:
  - 2191df9b-c982-4637-9913-a7facd3cffbe
  decides: true
  origin: new
- id: sv-a-07
  type: single_vendor
  question: In Azure Backup, what is a Backup vault used for, which workloads does it store, and what
    Azure model is it built on?
  gold_facts:
  - A Backup vault is created under Azure Backup's Data Protection Platform.
  - It holds backup data for newer workloads such as Azure Database for PostgreSQL servers and Azure Disks.
  - Backup vaults are based on the Azure Resource Manager model.
