  question: When Veeam Backup & Replication backs up PostgreSQL through Veeam Agent for Linux, how often
    can archived logs be backed up, how long can they be kept, and where are they staged during backup?
  gold_facts:
  - Archived logs are backed up every 15 minutes by default.
  - The log backup interval can be between 5 and 480 minutes.
