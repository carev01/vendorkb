- id: cv-13
  type: cross_vendor
  shape: comparison
  question: What does the "backup window" actually control in Cohesity FortKnox, and how is that different
    from the backup window in an AWS Backup plan?
  gold_facts:
  - 'Cohesity: the FortKnox backup window is a virtual air gap: you set a time interval and days of the
    week when connectivity to the cloud vaults is established, and it is severed outside that window.'
  - 'AWS: an AWS Backup window is a start time plus a duration within which backup jobs must start; console
    defaults are 12:30 AM, start within 8 hours, complete within 7 days.'
  - 'AWS: a job stays CREATED during the start window (retryable errors are retried at least every 10
    minutes) and becomes EXPIRED if it has not started when the window ends.'
  gold_sources:
