- id: ex-rt-01
  type: multi_article
  question: What does a Veeam SureBackup job verify, and how is it processed?
  gold_facts:
  - SureBackup verifies that machines can be recovered from backups; a SureBackup job runs in Full recoverability
    testing or Backup verification and content scan only mode.
  - Full recoverability testing starts the virtual lab and the application group machines, then boots
    verified machines from backup in an isolated environment and tests them.
  - Tests include heartbeat, ping, application initialization (120 s default) and test scripts (return
    code 0 = success).
  - After testing, the VM is powered off and a CRC backup integrity check verifies the backup file is
    not corrupted.
  - Backup verification and content scan only mode runs only the integrity check and malware/content scan,
    with no virtual lab or application group.
  - By default up to three machines are started and tested at the same time.
  gold_sources:
  - article_id: 62b8896f-e1c4-4d11-b95f-24c248885fe4
    section: SureBackup Job
  - article_id: 4200f582-f549-4103-bd4d-06020d00a229
    section: SureBackup Job Processing
  vendors:
