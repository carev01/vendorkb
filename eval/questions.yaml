- id: ma-b-04
  type: multi_article
  question: How do I get Veeam Backup Enterprise Manager to send its email notifications through our Microsoft
    365 tenant instead of SMTP? What needs to be set up in Azure and what do I enter in Enterprise Manager?
  gold_facts:
  - Enterprise Manager sends via the Microsoft Graph API using an access token from the Microsoft identity
    platform, so an application must be registered in the Azure portal.
  - The app registration uses the Accounts in this organizational directory only option and a Web redirect
    URI of https://<EnterpriseManagerServer>/api/Notifications/GrantPermissions.
  - The application must be granted the Microsoft Graph Mail.Send permission and given a client secret.
  - The registering account must have an active subscription and permission to register Microsoft Entra
    applications.
  - In Enterprise Manager (logged in with the Portal Administrator role), Configuration > Notifications
    > Server Settings, select Microsoft 365 as the mail server.
  - Enter the Application (client) ID, Tenant ID and client secret, save, then click Authorize now and
    allow access to the Microsoft 365 account.
  gold_sources:
