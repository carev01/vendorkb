- id: ex-rt-09
  type: cross_vendor
  shape: comparison
  question: How does immutability in Veeam Backup for Microsoft 365 compare with soft delete in Azure
    Backup?
  gold_facts:
  - 'Veeam: documented: Veeam Backup for Microsoft 365 immutability is enabled when adding an object storage
    repository; it cannot be enabled later or disabled.'
  - 'Veeam: documented: data cannot be modified or deleted within the immutability period, set as a number
    of days or equal to the repository retention.'
  - 'Veeam: documented: compliance mode is the default; governance mode lets a storage administrator with
    permissions override the lock.'
  - 'Veeam: documented: extra days are added automatically (30 for backup copy repositories, 10 for backup
    repositories) to reduce I/O.'
  - 'Microsoft: documented: Azure Backup soft delete keeps deleted backup data for 14 days by default,
    extendable to 180 days; the first 14 days are free.'
  - 'Microsoft: documented: soft-deleted data must be undeleted before it can be restored; it cannot be
    force-deleted early.'
  - 'Microsoft: documented: soft delete is enabled by default and cannot be disabled where secure by default
    is in effect.'
  gold_sources:
  - article_id: 32213b64-34a7-4d22-b215-bfbf0679f105
