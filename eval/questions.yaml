- id: ex-rt-05
  type: multi_article
  question: What should I consider when enabling backup immutability for Veeam Agent backups?
  gold_facts:
  - 'Veeam Agent immutability works only for object storage: Veeam Data Cloud Vault, Amazon S3, S3 compatible
    storage with Object Lock, Microsoft Azure Blob Storage and Google Cloud Storage.'
  - For S3 buckets, enable S3 Versioning and Object Lock when creating the bucket and disable the Object
    Lock default retention; Veeam Agent uses compliance mode.
  - For Azure Blob, enable blob versioning and version-level immutability on the container, and do not
    enable immutability on existing containers in the Azure portal.
  - Immutability can add API and storage charges from the storage provider.
  - Veeam Agent appends a block generation period (30 days for Amazon S3 and Google Cloud; 10 days for
    S3 compatible, Azure Blob and Veeam Data Cloud Vault); effective immutability = user period + block
    generation.
  - Obsolete restore points are removed by retention only after their immutability expires.
  gold_sources:
  - article_id: 1175394a-a25b-4b6d-bf24-095c4dd256f4
    section: Backup Immutability
