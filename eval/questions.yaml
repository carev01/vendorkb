- id: ma-b-03
  type: multi_article
  question: We're planning to deploy Veeam Kasten Enterprise on GKE from the Google Cloud Marketplace.
    Is the Enterprise edition a different build from Kasten Free, and what has to be in place on the cluster
    before we install it?
  gold_facts:
  - Veeam Kasten Free and Enterprise use the same container images and an identical install process.
  - Kasten Free is functionally the same as Enterprise but limited in support and scale; Enterprise is
    obtained with a license key from Kasten or by installing from a cloud marketplace.
  - The GKE node pool must have Compute Engine access set to Read Write.
  - The cluster must be created with a service account that has the required access to the underlying
    storage.
  - Kasten should be installed in a dedicated, non-default namespace (e.g. kasten-io), created beforehand
    or in the Marketplace wizard.
