- id: sv-d-06
  type: single_vendor
  question: Our Kubernetes apps sit on NFS volumes with no CSI snapshot support. Can Veeam Kasten still
    protect them, and what does Kasten recommend we do?
  gold_facts:
  - Kasten supports Generic Storage Backups (GSB) for storage without CSI drivers, but this approach is
    not recommended.
  - Kasten highly recommends storage with a CSI driver that supports VolumeSnapshot (snapshot and clone
    capabilities).
  - It recommends migrating persistent data from NFS to a storage system with such a CSI driver.
  - GSB uses a file-copy-based backup to an external location, which can then be restored onto CSI-capable
    storage to help the migration.
