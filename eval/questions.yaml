- id: ex-gq-09
  type: single_vendor
  question: How does Azure Backup encrypt backup data?
  gold_facts:
  - Backup data at rest is automatically encrypted with Azure Storage encryption using 256-bit AES; data
    in transit uses HTTPS and stays on the Azure backbone.
  - By default data in the Recovery Services vault is encrypted with platform-managed keys.
  - Customer-managed keys (RSA keys in Azure Key Vault) can be used for Azure VM backups, and must be
    enabled before protecting any items in the vault.
  - Infrastructure-level encryption adds a second layer and can only be configured together with customer-managed
    keys.
  - 'Workload-specific: VMs encrypted with ADE (BitLocker/DM-Crypt) and TDE-enabled SQL databases can
    be backed up.'
  gold_sources:
  - article_id: f3199c91-3ccb-4538-b3e7-b4e45521d8ec
    section: Encryption levels
  vendors:
  - Microsoft
