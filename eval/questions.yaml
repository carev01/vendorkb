- id: ma-b-06
  type: multi_article
  question: As a service provider on Veeam Data Cloud for Azure, I've just added a customer's Azure tenant
    and want to protect their Azure SQL databases. When can I start working in that tenant, and what network
    gotchas will hit the first SQL backup policy runs?
  gold_facts:
  - A newly added Azure tenant appears on the Azure Management page with Provisioning status.
  - The tenant's management dashboard is accessible only after Veeam provisions backup infrastructure
    to the tenant.
  - If public access is disabled on the SQL Server, the first policy run tries to create a private endpoint
    connection and fails; the connection request must be approved in the Azure portal or the policy keeps
    failing.
  - If public access is enabled on an Azure SQL Managed Instance, the policy uses the public endpoint,
    requiring inbound port 3342 open, even if a private endpoint is also configured.
