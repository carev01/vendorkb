- id: ex-rt-07
  type: cross_vendor
  shape: comparison
  question: Compare Veeam backup copy jobs with AWS Backup cross-Region copy for keeping an off-site copy.
  gold_facts:
  - 'Veeam: documented: backup copy is a job-driven process that creates instances of the same backup
    data in other on-site or off-site locations, supporting the 3-2-1 rule.'
  - 'Veeam: documented: backup copies have the same format as backup job output and have their own retention,
    including full backups for archival.'
  - 'AWS: documented: AWS Backup copies backups to other Regions on demand or automatically via a copy
    rule in a backup plan.'
  - 'AWS: documented: the first cross-Region copy is full and later ones incremental where supported;
    copies are re-encrypted with the destination vault''s key.'
  - 'AWS: documented: cross-Region copies are not supported for cold-tier storage.'
  gold_sources:
  - article_id: 3f4fec00-cd76-41b4-ac19-bec8894d09bb
