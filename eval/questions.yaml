- id: sv-b-01
  type: single_vendor
  question: I just created a new backup repository in Veeam Backup & Replication for my Veeam Agent for
    Oracle Solaris machines. Can the Solaris agents write to it straight away, and does it matter that
    the repository uses KMS encryption?
  gold_facts:
  - A newly created backup repository has access permissions set to Deny to everyone, so users must be
    granted access before they can store backups there.
  - The default backup repository is set to Allow to everyone right after installation (for testing/evaluation).
  - Veeam Agent for Oracle Solaris does not support Veeam backup repositories with KMS encryption enabled.
  - Access permissions are not needed when backups go through Veeam Agent backup jobs managed by Veeam
    Backup & Replication (it uses a TLS certificate instead).
  gold_sources:
  - article_id: 115e0d8c-babf-49f6-a562-93e6ddbb8f88
