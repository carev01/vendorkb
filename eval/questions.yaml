- id: cv-12
  type: cross_vendor
  shape: comparison
  question: How long can I keep Entra ID backups with Microsoft's built-in Entra Backup and Recovery compared
    with Veeam Data Cloud for Entra ID, and can I trigger a backup myself?
  gold_facts:
  - 'Microsoft: Microsoft Entra Backup and Recovery backs up supported objects automatically once a day
    and keeps up to seven days of backup history.'
  - 'Microsoft: no user or app, even with the highest admin privileges, can turn off, delete or modify
    these backups.'
  - 'Veeam: in Veeam Data Cloud for Entra ID the retention period can be increased up to 99 years (1,187
    months) but never shortened.'
  - 'Veeam: you can start an Entra ID backup policy manually to create an immediate restore point.'
