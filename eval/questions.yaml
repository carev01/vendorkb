  decides: true
  origin: new
- id: sv-b-02
  type: single_vendor
  question: With Veeam Agent for IBM AIX, what happens to the backup chain if I turn on encryption for
    an existing job, change its password later, or turn encryption off?
  gold_facts:
  - Enabling encryption makes the next job session create a full backup, and it and later incrementals
    are encrypted.
  - Changing the password of an already encrypted job makes the next session create a new incremental
    backup encrypted with the new password.
  - Disabling encryption makes the next job session create a full backup.
  gold_sources:
  - article_id: 18339979-a98d-4c40-a7a7-3674300f9f6f
