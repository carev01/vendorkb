  question: How many Cohesity FortKnox cloud vaults can I create in one region, and what do I need in
    order to use cold storage vaults?
  gold_facts:
  - Up to 10 cloud vaults can be created in a region, with a name chosen at creation.
  - A cloud vault's storage class can be Warm or Cold.
