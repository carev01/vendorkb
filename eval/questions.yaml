- id: sv-b-10
  type: single_vendor
  question: In a Veeam Service Provider Console backup policy writing to a network share, I want each
    managed computer to get its own subfolder. What has to be in place for that, and what is the default
    retention?
  gold_facts:
  - Managed computers must be members of an Active Directory domain, and the shared folder must be in
    the same domain.
  - Everyone must have Read and Write permissions on the shared folder.
  - Subfolders must not inherit permissions from the shared folder.
  - The machine account of each computer becomes owner of its subfolder and cannot access other subfolders.
  - Default retention is 7 days.
  gold_sources:
