- id: cv-14
  type: cross_vendor
  shape: comparison
  question: How do AWS Backup and Azure Backup each integrate with SAP HANA, and what restrictions should
    I plan around?
  gold_facts:
  - 'AWS: AWS Backup protects SAP HANA databases on Amazon EC2 instances, working with AWS Backint and
    AWS Systems Manager for SAP.'
  - 'AWS: SAP HANA restores are destructive (they overwrite the target database), and backup and restore
    jobs on the same database cannot run at the same time.'
  - 'Microsoft: Azure Backup uses a backup user (AZUREWLBACKUPHANAUSER) whose permissions are set up by
    a pre-registration script run on the SAP HANA instance.'
  - 'Microsoft: multiple SAP HANA instances on a single Azure VM cannot be backed up.'
  gold_sources:
