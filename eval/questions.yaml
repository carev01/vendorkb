- id: ma-a-08
  type: multi_article
  question: I've booted a Linux server from Veeam Recovery Media for Veeam Agent for Linux and the backup
    sits on an SMB share. How do I get networking working in the recovery environment, and what do I need
    to provide to mount the share?
  gold_facts:
  - If a DHCP server is present, Veeam Agent configures network settings automatically.
  - Network settings can be verified or configured manually with the nmtui tool via the Configure network
    option in the Recovery Media main menu.
  - A modified connection must be deactivated and then activated again to apply changes.
  - For the share, choose SMB and give the path in SERVER/DIRECTORY format.
  - For SMB you must also specify the domain, username and password of an account with access permissions
    on the share.
  - Veeam Agent mounts the shared folder to the /media directory of the recovery image OS file system.
