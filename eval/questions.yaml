- id: ex-gq-11
  type: single_vendor
  question: How do you restore a SQL Server database from an Azure Backup vault?
  gold_facts:
  - You can restore to a specific date/time (to the second) using log backups, or to a specific full or
    differential recovery point.
  - 'Restore targets: Alternate Location, Original location (overwrites the database; not allowed for
    Always On availability group databases), or Restore as files (.bak files).'
  - The destination server must be in the same Azure region and registered to the same vault (unless using
    Cross Subscription Restore).
  - 'Required permissions: Backup Operator on the vault and Contributor (write) on the source and target
    VMs.'
  - Point-in-time restore is only available for databases in full or bulk-logged recovery mode.
  - The master database should be restored with Restore as files and then T-SQL; CDC-enabled databases
    must use Restore as files.
  gold_sources:
