- id: ma-a-07
  type: multi_article
  question: As a company administrator in Veeam Service Provider Console, can I get a report showing whether
    our Microsoft 365 data is properly protected? Which Veeam Backup for Microsoft 365 versions does this
    need, what does the report check, and how is it delivered?
  gold_facts:
  - VSPC integration with Veeam Backup for Microsoft 365 requires version 6 or later; job management,
    reporting and restore require version 7 or later.
  - Consolidated reporting is provided by the Protected Microsoft 365 objects report.
  - The Protected Microsoft 365 objects report examines whether protected Microsoft 365 objects are compliant
    with the SLA target.
  - Backup reports are sent by email as PDF attachments and can be generated on a schedule; unscheduled
    reports must be generated manually.
  - Accessing backup reports requires at least one managed Veeam product in the infrastructure.
