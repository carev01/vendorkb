  question: Our WAN link is too slow to push the first full copy of our data to the cloud. Which products
    let us ship the initial backup data on a physical device instead?
  gold_facts:
  - 'Veeam: documented: Veeam Backup & Replication can use an AWS Snowball Edge or Azure Data Box device
    as object storage, offload backups to it, and ship it back so the data is seeded into Amazon S3 or
    Azure Blob storage.'
  - 'Microsoft: documented: Azure Backup can seed large initial MARS agent backups offline to a Recovery
    Services vault with Azure Data Box; the Azure Import/Export service is the other offline option.'
  - 'AWS: no evidence in the corpus'
  - 'Cohesity: no evidence in the corpus'
