    one go about it?
  gold_facts:
  - 'Veeam: documented: Veeam Kasten for Kubernetes is a Kubernetes-native platform for backup/restore,
    disaster recovery and mobility of Kubernetes applications.'
  - 'Microsoft: documented: Azure Backup protects AKS clusters through a Backup extension installed in
    the cluster; backups go to a blob container in a storage account in the same region and subscription
    as the cluster.'
  - 'AWS: documented: AWS Backup backs up an Amazon EKS cluster as a composite recovery point containing
    the cluster state plus persistent volumes (EBS, EFS, S3).'
