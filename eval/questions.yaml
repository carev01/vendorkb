- id: ma-a-04
  type: multi_article
  question: Using Veeam Explorer for Microsoft Exchange, how do I kick off a restore of a single email
    back to a Microsoft 365 tenant that enforces MFA, and what authentication options and account or certificate
    requirements apply?
  gold_facts:
  - To restore an item, select it in the preview pane and use Restore Item > Restore to on the Items tab,
    or right-click it and select Restore to.
  - Modern authentication uses a Microsoft Entra application and is used to restore to Microsoft 365 organizations
    with MFA enabled.
  - Modern authentication can use a one-time authentication code or a Microsoft Entra application certificate.
  - The certificate must have a private exportable key (and if taken from the certificate store, it must
    be in the Personal store); it can also be imported from a PFX file.
  - Basic authentication requires an account with both the Exchange Administrator and Global Administrator
    roles.
