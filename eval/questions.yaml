- id: ex-gq-13
  type: single_vendor
  question: How do you restore VMware VMs with Azure Backup Server?
  gold_facts:
  - 'Restores are run from the MABS Administrator Console Recovery view: pick the VM and a recovery point
    date, then Recover to open the Recovery Wizard.'
  - Original location recovery is only possible if no disks were added or deleted since the backup.
  - Alternate location recovery requires an ESXi host, resource pool, folder and datastore path.
  - Individual file/folder recovery is available only for Windows Server VMs and recovers to a network
    folder.
  - MABS v4 and later restores VMware VMs from the same vCenter in parallel, eight by default, raised
    with the MaxParallelRecoveryJobs registry key.
