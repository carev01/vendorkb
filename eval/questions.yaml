- id: ex-rt-08
  type: cross_vendor
  shape: comparison
  question: How do Veeam Backup & Replication and Azure Backup each protect backups against ransomware?
  gold_facts:
  - 'Veeam: documented: inline entropy analysis during backup and file system activity analysis of indexing
    data flag ransomware activity (encrypted files, ransom notes, extension changes).'
  - 'Veeam: documented: Scan Backup / Secure Restore with Veeam Threat Hunter, antivirus or YARA finds
    the last clean restore point and detects infected data.'
  - 'Veeam: documented: immutable backups (e.g. Veeam Plug-in for Microsoft Azure uses Azure immutable
    blob storage) cannot be deleted by any user until the immutability period ends.'
  - 'Veeam: documented: Cloud Connect insider protection moves deleted tenant backup files to a recycle
    bin for a configured number of days.'
  - 'Microsoft: documented: Azure Backup soft delete retains deleted backup data for 14 days at no cost
    (extendable up to 180 days).'
  - 'Microsoft: documented: Multi-user authorization (Resource Guard) protects critical operations such
    as disabling soft delete or reducing retention.'
  - 'Microsoft: documented: vault isolation with Azure RBAC, plus encryption of backup data (platform-
    or customer-managed keys).'
  gold_sources:
