- id: ma-a-06
  type: multi_article
  question: For Veeam Agent for Microsoft Windows, how does the Server edition differ from the Free and
    Workstation editions in backup scheduling and failed-job retries, and what kind of VSS snapshot does
    the Server edition take depending on the application-aware processing settings?
  gold_facts:
  - Free and Workstation editions can schedule the job daily at a specific time or on specific weekdays,
    or trigger it on specific events.
  - The Server edition supports daily, monthly and periodic schedules, configurable automatic retries
    and a backup window.
  - In Free and Workstation editions, a failed scheduled job is retried every 10 minutes within the next
    23 hours.
  - 'Server edition: with application-aware processing disabled, Veeam Agent requests a copy-only VSS
    snapshot.'
  - 'Server edition: with application-aware processing enabled and Perform copy only selected, it requests
    a copy-only VSS snapshot.'
  - 'Server edition: with application-aware processing enabled and Process transaction logs with this
    job selected, it requests a full VSS snapshot.'
  gold_sources:
  - article_id: f395cbcf-8480-4bcd-a886-38c1dcb220f7
