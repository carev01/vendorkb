  decides: true
  origin: new
- id: sv-a-10
  type: single_vendor
  question: For Azure Blob backup, how long should I keep blob versions in the storage account relative
    to my backup retention, and will the Backup vault clean up old versions for me?
  gold_facts:
  - For operational backup, set version retention to backup retention plus 7 days (e.g. 30 days -> 37
    days).
  - For vaulted backup only, version retention can be reduced after the first successful backup, keeping
    versions at least 7 days after backup completion.
  - If both operational and vaulted backup are used, apply the higher of the two retention requirements.
  - The Backup vault does not delete or reconcile blob versions in the source storage account; use Lifecycle
    Management policies or manual cleanup.
  gold_sources:
  - article_id: f4fb6701-1b5c-40a1-b9ea-382fd46ebccc
    section: Can I align blob versioning retention with my backup policy, such as 42 days?
  vendors:
  - Microsoft
  written_from:
  - f4fb6701-1b5c-40a1-b9ea-382fd46ebccc
  decides: true
  origin: new
- id: sv-a-11
  type: single_vendor
  question: When I query Azure Backup data in Log Analytics with the built-in system functions, do I get
    today's records, can I modify those functions, and do they include the legacy AzureDiagnostics table?
  gold_facts:
  - System functions return data only up to the last completed day (UTC); the current partial day requires
    querying the raw LA tables.
  - System functions are maintained by Microsoft and cannot be edited; use saved functions in Log Analytics
    for editable ones.
  - The ExcludeLegacyEvent parameter controls whether the legacy AzureDiagnostics table is queried; its
    default is true (resource-specific tables only).
  gold_sources:
  - article_id: f94f1312-c3e2-4fee-a5f1-05995a1e5bfb
  vendors:
  - Microsoft
  written_from:
  - f94f1312-c3e2-4fee-a5f1-05995a1e5bfb
  decides: true
  origin: new
- id: sv-a-12
  type: single_vendor
  question: Are snapshots vaulted to Cohesity FortKnox immutable by default, and what mechanism enforces
    it?
  gold_facts:
  - Snapshots vaulted in a FortKnox cloud vault are DataLocked by default.
  - DataLock makes storage WORM-compliant so backups and archives cannot be tampered with or deleted.
  - FortKnox uses AWS S3 Object Lock as the DataLock mechanism.
  gold_sources:
  - article_id: 0f3cb305-4373-49e3-baeb-e02daa49cda7
