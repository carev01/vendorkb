  key_terms:
  - bandwidth throttling
  - network throttling
  - bandwidth limit
  question: How can I stop backup traffic from saturating our network links? Which products let me cap
    or schedule the bandwidth backups use?
  gold_facts:
  - 'Veeam: documented: Veeam Backup & Replication network traffic rules can throttle traffic between
    backup infrastructure components; jobs falling under the same rule split the throttled bandwidth equally.'
  - 'Microsoft: documented: the Azure Backup MARS agent can limit bandwidth with separate work-hour and
    non-work-hour settings for chosen days of the week (Set-OBMachineSetting).'
  - 'AWS: documented: an AWS Backup gateway has no rate limit by default; you can set a bandwidth rate-limit
    schedule to cap its upload throughput to AWS Backup.'
  - 'Cohesity: documented: FortKnox lets you configure a bandwidth throttle, and changing it is a suggested
    fix when data transfer from a cloud vault is slow.'
