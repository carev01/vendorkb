- id: ma-b-01
  type: multi_article
  question: We're a Veeam Cloud Connect provider with insider protection turned on and an archive tier
    on our SOBR. If a tenant deletes a backup whose data was moved to the archive tier, what actually
    happens to it, and how does the tenant get data back from the archive tier?
  gold_facts:
  - For backups whose data was moved (not copied) to capacity/archive tier, the files are not physically
    moved to the recycle bin; they are only marked as moved to the recycle bin in the SP configuration
    database.
  - That record is kept for the number of days set in the tenant account (Keep deleted backup files for
    N days); after that the backup files are removed from object storage.
  - To restore deleted backups residing in the capacity/archive tier, the SP must download them using
    Windows PowerShell scripts (with Veeam Customer Support); they are saved to the recycle bin in the
    performance tier and removed from the object tier.
  - A tenant cannot restore from the archive tier without the SP; the SP must retrieve the archived data
    first.
  - In Cloud Connect, retrieving archived tenant data is available only through a PowerShell cmdlet, not
    the console.
  - The tenant's restore attempt fails with a message giving the restore point ID; the tenant sends it
    to the SP, who retrieves the data, publishes the restore point and notifies the tenant to retry.
  gold_sources:
  - article_id: 787d942e-20b0-42b5-b104-9eec01dd262d
    section: Insider Protection and Capacity Tier
  - article_id: abf75bbf-f3f6-4a64-9881-43fc785a098b
    section: How Restore from Archive Tier Works
  vendors:
  - Veeam
