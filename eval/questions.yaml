- id: ex-rt-02
  type: single_vendor
  question: How does Veeam Backup & Replication detect malware in backups?
  gold_facts:
  - File system activity analysis of indexing data detects suspicious files/extensions, indicators of
    compromise, deleted files and extension changes, marking workloads Suspicious.
  - Inline entropy analysis of the data stream during backup detects encrypted files, onion links and
    ransom notes, marking workloads Suspicious.
  - Signature-based detection (Veeam Threat Hunter), 3rd party antivirus and YARA rules scan restore points
    during Scan Backup, Secure Restore and SureBackup, marking workloads Infected.
  - Scan Backup can find the last clean restore point.
  - 3rd party malware protection solutions can report detections through the Veeam Incident API.
  gold_sources:
  - article_id: 941f4db6-d2ed-4c4e-a02a-8df1d77ba17a
    section: Malware Detection Methods
