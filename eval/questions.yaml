  type: multi_article
  question: When I install Veeam Service Provider Console, which port do the web portal and REST API listen
    on by default, how can I lock that endpoint down to TLS 1.2 only, and which certificate does it present
    to browsers out of the box?
  gold_facts:
  - The default port for the Veeam Service Provider Console website and REST API is 1280.
  - Selecting the High security mode check box at the Port Configuration step enforces TLS 1.2 and disables
    weak ciphers.
  - High security mode disables SSL 2.0, SSL 3.0 and TLS 1.0 and the Triple DES and RC4 ciphers in the
    Windows Registry, which may interfere with third-party software on the same machine.
  - Browsers and REST API clients connect using the Veeam Service Provider Console Web UI certificate.
  - By default the Web UI certificate is a self-signed certificate generated during installation or upgrade,
    and it can be changed in the Veeam Service Provider Console settings.
