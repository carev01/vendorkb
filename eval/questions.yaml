- id: ma-a-05
  type: multi_article
  question: As a VCSP on rental licensing, when is my monthly usage report due, and if I switch to automatic
    license reporting, how long is the auto-reported license valid and what keeps it from expiring?
  gold_facts:
  - Rental license consumption is reported by the third day of each month through VCSP Pulse, and the
    partner is billed by the Veeam Aggregator.
  - A newly created automatically reported license is valid for 2.5 months.
  - The license is extended every month if it is reported in the VCSP Pulse monthly usage report and the
    report is closed; if Veeam does not receive the report, the license expires.
  - Auto-reported usage is populated automatically on the third day of the month (older product versions
    on the fifth or sixth day).
  - Automatic license reporting must first be enabled for the account in VCSP Pulse (Pulse Settings >
    Auto-Reporting), and usage must be submitted manually until it is configured.
  gold_sources:
  - article_id: b8b336d9-7c91-440b-b49a-307f56932810
