- id: ex-gq-01
  type: single_vendor
  question: How does AWS Backup copy backups to another AWS Region?
  gold_facts:
  - AWS Backup copies backups to other AWS Regions either on demand (Copy action on a recovery point in
    a backup vault) or automatically through a copy rule (Copy to destination) in a scheduled backup plan.
  - The first copy to a new Region is a full copy; later copies are incremental if the service supports
    incremental backups.
  - The copy is re-encrypted with the customer managed key of the destination vault (for Amazon EBS, a
    different KMS key forces a full copy).
  - Cross-Region copies are not supported for storage in cold tiers.
  - For Amazon RDS the custom option group is not copied; a matching option group must exist in the destination
    Region or the copy fails.
  gold_sources:
  - article_id: 78e2b9e5-bf0c-4e76-8b83-fc54e76f52cd
    section: Creating backup copies across AWS Regions
  vendors:
  - AWS
