- id: cv-15
  type: cross_vendor
  shape: comparison
  question: We want our on-prem backup traffic to Azure to stay off the public internet. How do Cohesity
    FortKnox Azure vaults and Azure Backup Recovery Services vaults handle private connectivity?
  gold_facts:
  - 'Cohesity: FortKnox Azure cloud vaults can be reached through an Azure Private Endpoint over ExpressRoute
    or an Azure VPN, using a storage account resource ID requested from Cohesity.'
  - 'Cohesity: each Azure region with a FortKnox vault needs its own private endpoint, though several
    Cohesity clusters sharing a vault can use one endpoint.'
  - 'Microsoft: Recovery Services vault private endpoints can be created only for new vaults with no registered
    or protected items (MABS needs v4 or later).'
  - 'Microsoft: with a vault private endpoint, ExpressRoute Private Peering is required to carry backup
    traffic between on-premises and Azure.'
  gold_sources:
