- id: sv-b-09
  type: single_vendor
  question: What are the limitations of sending Veeam Agent for Microsoft Windows backups to object storage?
  gold_facts:
  - Object storage with lifecycle rules enabled is not supported.
  - Synthetic full backups are not supported for backups in object storage.
  - The compact full backup file option is not supported for backups in object storage.
  - S3 compatible storage must be accessible over HTTPS.
  - Azure Blob Storage with a general-purpose V1 storage account cannot be used in direct connection mode.
  - If Veeam Backup & Replication uses HTTP/HTTPS proxies, backup to object storage repositories is only
    available through a gateway server.
  gold_sources:
