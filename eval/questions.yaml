- id: ma-b-07
  type: multi_article
  question: I'd like to enable Azure Backup for a SQL Server VM straight from the VM's Backup blade, but
    our policy is that backup traffic goes over private endpoints. What vault will the blade create for
    me, and what ordering constraints do I have to respect for private endpoints?
  gold_facts:
  - Enabling backup from the VM blade registers the VM with Azure Backup and autoprotects all SQL Server
    instances in it (existing and future databases).
  - A new vault created from the blade is placed in the same subscription and region as the SQL Server
    VM.
  - The new vault uses geo-redundant storage (GRS); redundancy must be changed before protecting the VM.
  - Private endpoints can only be created for a Recovery Services vault that has never had items protected
    or registered, so the private endpoint must be set up before any backup is configured (a new vault
    is recommended).
  - If private endpoints are removed after a SQL server is registered, the container must be re-registered
    with the vault (protection need not be stopped).
  gold_sources:
