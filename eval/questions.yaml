  question: Why can't Veeam Backup & Replication restore my Google Cloud SQL instance back to its original
    location, and whose permissions does the restore use by default?
  gold_facts:
  - Restore to the original location is not supported if the source Cloud SQL instance still exists in
    that location.
  - It is also not supported if the source instance was deleted recently (less than a week ago) or if
    its name is reserved.
