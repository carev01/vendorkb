  type: cross_vendor
  shape: comparison
  question: How is Microsoft 365 Backup billed compared with how Veeam Backup for Microsoft 365 is licensed?
  gold_facts:
  - 'Microsoft: Microsoft 365 Backup is a pay-as-you-go offering charged by consumption rather than per
    seat, set up against an Azure subscription.'
  - 'Veeam: Veeam Backup for Microsoft 365 is licensed per protected user account, each consuming one
    license unit; restores need no license.'
  - 'Veeam: a license unit is revoked automatically when the object has not been backed up for 31 days,
    and Teams objects and group/non-personal SharePoint sites do not consume units.'
  gold_sources:
