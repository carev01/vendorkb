- id: ex-gq-12
  type: single_vendor
  question: How do you back up an encrypted Azure VM?
  gold_facts:
  - VMs encrypted with platform-managed or customer-managed keys (SSE) need no special action to back
    up.
  - Azure Backup supports managed VMs encrypted with ADE (BEK, or BEK with KEK); VMs with unmanaged disks
    are not supported.
  - 'Azure Backup needs read-only access to the keys and secrets in the key vault: add an access policy
    for Backup Management Service (key permissions can be cleared for BEK-only).'
  - For RBAC-enabled key vaults, assign the Key Vault Administrator role (or a custom role) to the Backup
    Management Service app.
  - ADE-encrypted VMs can be backed up and restored only within the same subscription, and only standalone
    keys (not certificate keys) are supported.
  - Backup is enabled from the Recovery Services vault by choosing a policy and adding the encrypted VMs.
  gold_sources:
  - article_id: a0e14280-837e-4e23-a930-9119e7692e94
    section: Provide permissions
