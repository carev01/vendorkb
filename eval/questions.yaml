  type: single_vendor
  question: Before I turn on MFA for my Veeam Service Provider Console account, what could break and what
    clock requirement applies to the authenticator device?
  gold_facts:
  - VSPC MFA is TOTP-based and requires an authenticator app on a trusted device.
  - Enabling MFA on an account used for third-party integration stops that integration; configure an API
    key first.
  - The time difference between the trusted device and the machine running the VSPC Web UI must not exceed
    one minute.
