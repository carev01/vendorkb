    which they cannot be moved, modified or deleted.'
  - 'Veeam: documented: cloud plug-ins use the cloud''s native lock (Veeam Plug-in for Microsoft Azure
    uses Azure immutable blob storage), with the immutability period based on policy retention, and no
    user can delete the data early.'
