  question: I need to run my own scripts right before and after each backup, for example to quiesce an
    application. Which products support custom pre- and post-backup scripts?
  gold_facts:
  - 'Veeam: documented: Veeam Agent for Linux runs pre-job and post-job scripts, and in the Server edition
    pre-freeze and post-thaw scripts around the snapshot; the default script timeout is 10 minutes.'
  - 'Microsoft: documented: Azure Backup Server (MABS) runs a pre-backup and post-backup script per data
    source, defined in ScriptingConfig.xml on the protected computer and executed under the local system
    account.'
  - 'AWS: no evidence in the corpus'
  - 'Cohesity: no evidence in the corpus'
