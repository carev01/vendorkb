- id: ma-b-02
  type: multi_article
  question: I want Veeam Kasten to export application backups into a Veeam Backup & Replication repository.
    What do I have to set up on the Kasten side, and what account and repository permissions does VBR
    need for this to work?
  gold_facts:
  - In the Veeam Kasten dashboard, configure a Veeam backup repository location profile specifying the
    VBR server and the repository that will keep the exported backups.
  - Create a Kasten policy that selects that Veeam backup location profile; the policy then appears in
    the VBR infrastructure.
  - The VBR user account used by Kasten must have the Veeam Backup Administrator role (directly or via
    a group with that role).
  - The target repository must have Allow to everyone or Allow to the following accounts or groups only
    access permissions.
  - Changing access permissions of a repository that already holds Kasten-exported backups makes the Kasten
    policy fail.
  - With VBR on Linux, a domain user cannot be used for Kasten location profiles.
  gold_sources:
