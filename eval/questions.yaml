- id: ex-gq-08
  type: multi_article
  question: What is soft delete in Azure Backup and how long does it retain deleted items?
  gold_facts:
  - Soft delete delays permanent deletion of backup data (and vaults), so data deleted accidentally or
    maliciously can be recovered.
  - Deleted data is retained for 14 days by default; the soft-delete retention can be extended up to 180
    days.
  - The first 14 days cost nothing; retention beyond 14 days is charged.
  - To restore soft-deleted data you must undelete it first, which returns it to the Stop protection with
    retain data state.
  - Soft-deleted items cannot be force-deleted early, and a Recovery Services vault cannot be deleted
    while it holds soft-deleted items.
  gold_sources:
  - article_id: 1cde879f-5152-4b0e-a9e8-9d4e762ee9ed
    section: What's soft delete?
