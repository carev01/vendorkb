- id: ex-gq-14
  type: single_vendor
  question: How do you change the backup retention period in AWS Backup?
  gold_facts:
  - The retention period of a continuous backup rule is changed through the backup plan; the UpdateRecoveryPointLifecycle
    API/CLI cannot be used for continuous backups.
  - Continuous backup retention ranges from 1 to 35 days.
  - The change takes effect after the next backup completes.
  - For Amazon S3, changing retention stops the current continuous recovery point and creates a new one;
    for Aurora, RDS and SAP HANA on EC2 the existing recovery point is updated.
  gold_sources:
