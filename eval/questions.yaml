  type: multi_article
  question: I want Veeam Agent for Oracle Solaris to back up to an S3 bucket from the command line. Which
    object storage types can I create a repository on, what do I have to prepare first, and can I later
    use the Copy backup function in Veeam Backup & Replication to move those backups elsewhere?
