  type: multi_article
  question: In Veeam Backup for Microsoft 365, I'm setting up an Azure Blob object storage repository
    with immutability and also want to use the Azure archiver appliance to copy data to the Archive tier.
    What retention restrictions apply to that repository, and what Azure roles does the account need to
    create the archiver's service account application?
  gold_facts:
  - Once configured, the repository's retention period setting cannot be changed.
  - The Keep forever retention option is unavailable for object storage repositories with immutability
    enabled (and 10/25 years are not recommended with immutability).
  - The retention type (snapshot-based or item-level) cannot be changed once set.
  - Using the Azure archiver appliance requires a Microsoft Azure service account.
  - The user creating the Microsoft Entra application must have the Application Administrator role and
    be Owner of the selected Azure subscription.
  - That user account must not be a Contributor of the selected subscription.
