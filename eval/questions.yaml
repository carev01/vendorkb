  question: We want a second person to sign off before anyone can delete backups or do other destructive
    operations. Which of these vendors' products offer that kind of multi-person approval, and how does
    each one implement it?
  gold_facts:
  - 'Veeam: documented: Veeam Backup & Replication four-eyes authorization requires a second user with
    the Backup Administrator or Security Administrator role to approve operations such as deleting backups
    or removing repositories; requests nobody processes are rejected automatically after 7 days by default.'
  - 'Microsoft: documented: Azure Backup Multi-user authorization (MUA) protects critical operations on
    Recovery Services vaults and Backup vaults through a separate Azure resource called a Resource Guard.'
  - 'AWS: documented: AWS Backup can associate a Multi-party approval team with a logically air-gapped
    vault so that access to the vault is approved collaboratively.'
  - 'Cohesity: documented: FortKnox quorum approvals require a predefined quorum of approvers to approve
    sensitive or privileged operations before they run.'
