- id: ex-gq-10
  type: single_vendor
  question: How do you configure and run Cross Region Restore in Azure Backup?
  gold_facts:
  - Cross Region Restore restores data in the secondary Azure paired region, even without an outage in
    the primary region (useful for drills).
  - It is supported only for a Backup vault with Geo-redundant storage redundancy, and incurs additional
    charges.
  - 'Enable it in the vault''s Properties: Vault Settings > Cross Region Restore > Update > Enable.'
  - After enabling, backup items can take up to 48 hours to appear in the secondary region; recovery points
    can take up to 12 hours to replicate.
  - A GRS vault with Cross Region Restore enabled cannot be changed to ZRS or LRS after protection starts.
  - To restore, filter backup instances by Instance Region = Secondary Region and choose Restore to secondary
    region.
  gold_sources:
  - article_id: e2f3ee74-04f0-4d6f-9925-83dc0b43b193
    section: Enable Cross Region Restore on a Backup vault
  vendors:
  - Microsoft
