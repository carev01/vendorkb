  decides: false
  origin: golden_questions
- id: ex-gq-04
  type: single_vendor
  question: How does AWS Backup support continuous backups and point-in-time recovery?
  gold_facts:
  - Continuous backup first creates a full backup and then continuously backs up the resource's transaction
    logs; PITR replays the logs to the chosen time.
  - PITR restores to a chosen time with 1-second precision, going back at most 35 days.
  - Continuous backup is enabled in a backup plan rule; on-demand continuous backups are not supported.
  - A resource can have only one continuous backup (recovery point).
  - Continuous backups cannot transition to cold storage.
  - If a continuous backup cannot be performed, AWS Backup falls back to a snapshot backup.
  - Supported services include Amazon S3, Amazon RDS, Aurora and SAP HANA on Amazon EC2.
  gold_sources:
  - article_id: d4d25628-1f6e-42ea-a5c5-e66b2e1bf2f8
    section: Point-in-time recovery considerations
  vendors:
  - AWS
  written_from:
  - d4d25628-1f6e-42ea-a5c5-e66b2e1bf2f8
  decides: false
  origin: golden_questions
- id: ex-gq-05
  type: single_vendor
  question: How are Amazon Redshift clusters backed up?
  gold_facts:
  - AWS Backup backs up Amazon Redshift provisioned clusters, on demand or on a schedule as part of a
    backup plan.
  - Amazon Redshift must be turned On under Protected resources (opt-in) before it can be included in
    a backup plan.
  - Tables cannot be backed up by themselves; they are backed up as part of the cluster, but a single
    table (item-level) or the whole cluster can be restored.
  - Once manual snapshot settings are managed through AWS Backup, they can no longer be managed in Amazon
    Redshift.
  gold_sources:
