[project]
name = "vendorkb"
version = "0.1.0"
description = "Backup vendor knowledge system: chunk retrieval with citations over vendor documentation"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "openai>=1.40",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "pydantic-settings>=2.3",
  "anthropic>=2.6.0",
  "rapidfuzz>=3.14.6",
  "scikit-learn>=1.9.1",
  "pyyaml>=6.0.3",
  "ruamel-yaml>=0.18,<0.20",
  "mcp>=2.3,<3",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "testcontainers[postgres]>=4.5",
  "pyyaml>=6",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
vendorkb = "vendorkb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vendorkb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: hits real endpoints (DocExtractor, embedder, reranker); opt-in",
]
addopts = "-m 'not live'"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# The classic defaults, pinned: newer ruff releases widen the default set.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true
