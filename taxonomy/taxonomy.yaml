- id: recovery.recreate_root_structure
  name: Recreate root directory structure
  definition: Whether restoring recreates the top-level folder hierarchy at the restore destination when that hierarchy is missing.
  aliases: [recreate root directory structure on restore]
  applies_to: [file]
  proposed: true
- id: security.key_regeneration
  name: Key regeneration
  definition: Whether the product can regenerate or rotate its encryption keys.
  aliases: [regenerate shared keys]
  applies_to: all
  proposed: true
- id: governance.data_catalog_registration
  name: Data catalog registration
  definition: Whether protected data assets and their metadata can be registered into an enterprise data catalog.
  aliases: [register data assets into data catalog]
  applies_to: all
  proposed: true
- id: operations.job_configuration_removal
  name: Backup job removal
  definition: Whether backup job configurations can be deleted from the backup product.
  aliases: [remove backup job configuration]
  applies_to: all
  proposed: true
- id: coverage.user_scope_exclusion
  name: User-removable scope items
  definition: Whether administrators can remove specific accounts, subscriptions or containers from a protection scope after it is defined.
  aliases: [remove subscriptions from protection scope]
  applies_to: [cloud]
  proposed: true
- id: storage.replication_from_backup
  name: Backup replication
  definition: Copying backup data to another location or target as a separate replica.
  aliases: [replication from backup]
  applies_to: all
  proposed: true
- id: vendor.prerequisite_license
  name: Prerequisite license
  definition: Another product's license that must be held before the product's capability can be used.
  aliases: [requires entra id p1 or p2 license]
  applies_to: all
  proposed: true
- id: recovery.application_certificates
  name: Application certificate restore
  definition: Whether certificates used by an application can be restored from a backup.
  aliases: [restore application certificates from backup]
  applies_to: [app]
  proposed: true
- id: recovery.deleted_tenant_restore
  name: Restore deleted tenant
  definition: Recovering an entire organization or tenant that has been deleted from the service.
  aliases: [restore deleted organizations]
  applies_to: [saas]
  proposed: true
- id: recovery.field_value_restore
  name: Field-level value restore
  definition: Whether individual field values of a record can be restored on their own, including into a tenant other than the source.
  aliases: [restore field values to same or sandbox tenant]
  applies_to: [saas]
  proposed: true
- id: recovery.custom_field_values
  name: Custom field value restore
  definition: Whether custom column or field values attached to items are restored along with the items.
  aliases: [restore of custom column values]
  applies_to: [saas]
  proposed: true
- id: recovery.file_system_settings
  name: Restore file system settings
  definition: Whether the product can restore file system settings such as permissions and attributes alongside file data.
  aliases: [restore of file system settings]
  applies_to: [file, file.nas]
  proposed: true
- id: recovery.privileged_objects
  name: Privileged object restore
  definition: Restoring privileged accounts or groups together with their elevated permissions and memberships.
  aliases: [restore of privileged objects]
  applies_to: [app.directory]
  proposed: true
- id: operations.restore_session_logs
  name: Restore session logs
  definition: Whether the product keeps and lets administrators review logs of individual restore operations.
  aliases: [restore session log review]
  applies_to: all
  proposed: true
- id: recovery.system_database_to_availability_group
  name: System database restore to availability group
  definition: Whether system databases can be restored directly into a database availability group configuration.
  aliases: [restore system database to always on availability group]
  applies_to: [app.database]
  proposed: true
- id: recovery.proxy_routing
  name: Restore via proxy
  definition: Whether restore traffic can be routed through an internet proxy server.
  aliases: [restore through internet proxy server]
  applies_to: all
  proposed: true
- id: recovery.raw_device_mapping_target
  name: Restore to raw device mapping disk
  definition: Restoring virtual machine data onto a raw device mapping disk that passes storage directly to the guest.
  aliases: [restore to rdm disk]
  applies_to: [virtualization.hypervisor]
  proposed: true
- id: recovery.alternate_database_target
  name: Restore to alternate database
  definition: Restoring a database backup into a different database instance or location than the original source.
  aliases: [restore to recovery or alternate database]
  applies_to: [app.database, cloud.database]
  proposed: true
- id: recovery.programmatic_interface
  name: Programmatic restore interface
  definition: Whether restores can be driven through scripting or API interfaces instead of only a console or user interface.
  aliases: ['restore using powershell direct, vix api or vsphere automation api']
  applies_to: [virtualization]
  proposed: true
- id: security.tenant_domain_restriction
  name: Connection restriction by domain
  definition: Limiting which tenant or organisation connections can be made to the product based on the account's email or login domain.
  aliases: [restrict org connections by my domain]
  applies_to: [saas]
  proposed: true
- id: retention.retained_after_job_removal
  name: Retention after job removal
  definition: Whether backup data is kept after the backup job that created it is removed.
  aliases: [retain backup data after job removal]
  applies_to: all
  proposed: true
- id: retention.enforcement_check_interval
  name: Retention enforcement check interval
  definition: How often the product checks backups against their retention period and removes expired restore points.
  aliases: [retention period enforcement check interval]
  applies_to: all
  value_unit: hours
  proposed: true
- id: retention.source_tag_driven
  name: Source-tag-driven retention
  definition: Whether retention is assigned automatically from retention tags or labels defined in the source system.
  aliases: [retention rules based on exchange retention tags]
  applies_to: [app.collaboration]
  proposed: true
- id: retention.after_source_deletion
  name: Retention after source deletion
  definition: Whether and for how long backups of workloads deleted from the source are kept before automatic removal.
  aliases: [retirement plan for workloads deleted on source]
  applies_to: all
  proposed: true
- id: security.backup_share_revocation
  name: Revoking shared backup access
  definition: Whether access granted to others to view or restore a shared backup can be withdrawn after it is given.
  aliases: [revoke backup share access]
  applies_to: all
  proposed: true
- id: recovery.san_transport_restore
  name: SAN transport restore
  definition: Whether virtual machine data can be restored over a storage area network data path instead of the network.
  aliases: [san transport mode restore]
  applies_to: [virtualization]
  proposed: true
- id: coverage.sandbox_environments
  name: Sandbox environment backup
  definition: Whether the product can back up non-production sandbox environments of a SaaS application.
  aliases: [sandbox backup]
  applies_to: [saas]
  proposed: true
- id: coverage.environment_type_identification
  name: Environment type identification
  definition: Whether the product can detect and report the type of an environment, such as whether an org is a production or sandbox instance.
  aliases: [sandbox type identification]
  applies_to: [saas]
  proposed: true
- id: security.shared_access_link_validity
  name: Shared access link validity
  definition: How long a temporary shared access link to stored backup data remains valid before it expires.
  aliases: [sas link validity period]
  applies_to: [storage.service]
  value_unit: duration
  proposed: true
- id: recovery.content_filter
  name: Content search filtering
  definition: Whether backups can be searched by the contents of the backed-up data, not only by metadata such as names or dates.
  aliases: [search filtering by content]
  applies_to: all
  proposed: true
- id: recovery.secondary_index
  name: Secondary index restore
  definition: Whether secondary indexes of a database can be restored along with its data.
  aliases: [secondary index restore]
  applies_to: [app.database, cloud.database]
  proposed: true
- id: storage.selective_recall
  name: Selective recall
  definition: Recalling only chosen migrated files from a lower storage tier rather than all of them.
  aliases: [selective recall of migrated files]
  applies_to: [storage]
  proposed: true
- id: security.server_certificate_validation
  name: Server certificate validation
  definition: Whether the product verifies server certificates against trusted root or intermediate certificate authority certificates.
  aliases: [server certificate validation using root or intermediate ca certificates]
  applies_to: all
  proposed: true
- id: operations.service_status_page
  name: Service status page
  definition: Whether the vendor publishes a page showing current service health and incidents.
  aliases: [service status page]
  applies_to: all
  proposed: true
- id: recovery.site_or_account_scope
  name: Site or account level restore
  definition: Restoring the content of a single site or user account rather than an entire tenant.
  aliases: [site and account content restore]
  applies_to: [saas]
  proposed: true
- id: coverage.multiple_volume_types_per_backup
  name: Multiple volume types per backup
  definition: Whether a single backup can capture several types of persistent volumes together.
  aliases: [snapshots of multiple persistent volume types in a single backup]
  applies_to: [kubernetes]
  proposed: true
- id: security.soft_delete_of_backups
  name: Soft delete of backups
  definition: Deleted backup data stays recoverable for a set period before it is permanently removed.
  aliases: [soft delete for vaults]
  applies_to: all
  proposed: true
- id: security.soft_delete_of_recovery_points
  name: Soft delete of recovery points
  definition: Deleted backup recovery points are kept for a set period so they can be restored or undeleted before they are permanently removed.
  aliases: [soft delete of log recovery points]
  applies_to: all
  proposed: true
- id: security.database_authentication_method
  name: Database authentication method
  definition: The authentication method, such as SQL or integrated accounts, that backup uses to connect to a database.
  aliases: [sql account authentication for backup]
  applies_to: [app.database]
  proposed: true
- id: vendor.status_updates
  name: Status updates
  definition: How the vendor announces service status and incidents to customers, and through which channels.
  aliases: ['status update subscriptions via email, rss or slack']
  applies_to: all
  proposed: true
- id: storage.pool_expansion
  name: Storage pool expansion
  definition: Whether capacity can be added to an existing backup storage pool without re-creating it.
  aliases: [storage pool expansion]
  applies_to: all
  proposed: true
- id: recovery.reconcile_deletion
  name: Delete extraneous items on restore
  definition: Whether a restore removes items in the target that are absent from the backup so the target matches the backup state.
  aliases: [synchronous delete and reconcile during restore]
  applies_to: all
  proposed: true
- id: coverage.tag_based_selection
  name: Tag-based selection
  definition: Whether databases to protect can be selected for backup by matching tags or labels rather than by naming each one.
  aliases: [tag-based database selection, tag-based inclusion and exclusion of resource groups from protection]
  applies_to: [cloud.database, app.database]
  proposed: true
- id: operations.tenant_provisioning_time
  name: Tenant provisioning time
  definition: How long it takes to create and make ready a new backup tenant.
  aliases: [tenant provisioning time]
  applies_to: [saas]
  value_unit: minutes
  proposed: true
- id: recovery.uncommitted_move_rollback
  name: Rollback of uncommitted move
  definition: Whether a staged workload migration can be reverted to the source before it is committed.
  aliases: [uncommitted move with rollback]
  applies_to: [virtualization]
  proposed: true
- id: storage.vault_count_limit
  name: Vaults per subscription
  definition: The maximum number of backup vaults or storage containers that can be created under one subscription or account.
  aliases: [unlimited vaults per subscription]
  applies_to: all
  value_unit: count
  proposed: true
- id: security.bring_own_app_registration
  name: Customer-supplied app registration
  definition: Whether the product can authenticate to a SaaS platform using an app registration the customer already owns in the identity provider, instead of one the vendor provisions.
  aliases: [use existing microsoft entra application]
  applies_to: [saas.productivity]
  proposed: true
- id: security.identity_provisioning
  name: Identity provisioning
  definition: Whether user accounts can be created and maintained automatically from an external identity directory or provider.
  aliases: [user provisioning via entra id integration]
  applies_to: all
  proposed: true
- id: coverage.user_defined_subsets
  name: User-defined data subsets
  definition: Ability to define custom backup selections of specific shares or subsets of a source rather than only whole sources.
  aliases: [user-defined subclients for specific shares]
  applies_to: [file, file.nas]
  proposed: true
- id: recovery.item_detail_view
  name: Browse backed-up item details
  definition: Viewing the metadata and details of individual items inside a backup without restoring them.
  aliases: [view backed-up email details]
  applies_to: [app.collaboration]
  proposed: true
- id: coverage.platform_versions
  name: Supported platform versions
  definition: Which major and minor versions of a host platform or hypervisor the product supports.
  aliases: [vmware vsphere version compatibility]
  applies_to: [virtualization.hypervisor]
  proposed: true
- id: coverage.volume_manager
  name: Volume manager support
  definition: Whether data on logical volume manager volumes can be protected and restored.
  aliases: [volume manager support]
  applies_to: [file, endpoint.server, virtualization]
  proposed: true
- id: coverage.network_configuration
  name: Network configuration coverage
  definition: Whether cloud network configuration such as VPCs and subnets can be backed up and restored.
  aliases: [vpc and subnet configuration backup and restore]
  applies_to: [cloud.network_config]
  proposed: true
- id: operations.report_branding
  name: Report branding
  definition: Whether reports can be customized with a custom logo and branding for white-labeled delivery.
  aliases: [white-labeled reports with custom logo]
  applies_to: all
  proposed: true
- id: coverage.wildcard_file_selection
  name: Wildcard file selection
  definition: Whether files can be selected for backup or restore using wildcard patterns.
  aliases: [wildcard file selection]
  applies_to: [file]
  proposed: true
- id: storage.worm_support
  name: WORM storage support
  definition: Whether backups can be written to write-once-read-many storage that prevents modification or deletion for a set period.
  aliases: [worm storage]
  applies_to: all
  proposed: true
