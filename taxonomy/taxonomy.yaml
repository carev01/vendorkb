version: 2
dimensions:
# ---------------- coverage ----------------
- id: coverage.backup
  name: Object-type backup coverage
  definition: Whether a given object type of a workload is captured by backups.
  aliases: [backup, backs up, protection, protects, data protection, backup support, backup of, captured in backups, included in backup]
  applies_to: all
- id: coverage.restore
  name: Object-type restore coverage
  definition: Whether a given object type of a workload can be restored from backups.
  aliases: [restore, recovery, recover, restores, recovers, granular restore, item restore, object restore, restore support]
  applies_to: all
- id: coverage.export
  name: Object-type export coverage
  definition: Whether a given object type can be exported or downloaded from backups outside the protected system.
  aliases: [export, download, export from backup, download from backup, export to file, data export]
  applies_to: all
- id: coverage.compare
  name: Object-type comparison coverage
  definition: Whether a given object type can be compared between restore points or against production.
  aliases: [compare, comparison, diff, compare with production, compare restore points, change comparison]
  applies_to: all
- id: coverage.attribute_depth
  name: Attribute coverage depth
  definition: How many attributes or properties of an object type are captured and restorable.
  aliases: [attributes backed up, number of attributes, attribute coverage, properties captured, attribute-level coverage]
  applies_to: all
  value_unit: attributes
- id: coverage.environment_types
  name: Environment types covered
  definition: Which environments of a workload are supported, such as production, sandbox, developer or trial tenants.
  aliases: [sandbox orgs, production and sandbox, developer orgs, trial tenants, environment support, non-production environments]
  applies_to: [saas]
- id: coverage.workload_variants
  name: Workload variants covered
  definition: Which editions, engines, clouds or sub-products of a workload are supported, and which are excluded.
  aliases: [supported engines, supported clouds, supported editions of the workload, variant support, database engine support, supported versions]
  applies_to: all
- id: coverage.exclusions
  name: Documented coverage exclusions
  definition: Items or object types the documentation states are not protected, with the stated reason.
  aliases: [not backed up, unsupported items, excluded items, limitations of coverage, items not protected, what is not backed up]
  applies_to: all
# ---------------- protection ----------------
- id: protection.snapshot
  name: Snapshot-based protection
  definition: Creating and managing native snapshots of the workload, kept in the provider's or array's own format.
  aliases: [snapshot, snapshots, cloud-native snapshot, native snapshot, snapshot orchestration, snapshot policy, snapshot management]
  applies_to: all
- id: protection.snapshot_replication
  name: Snapshot copy and replication
  definition: Copying native snapshots to another region, account or array.
  aliases: [snapshot copy, snapshot replication, cross-region snapshot copy, snapshot replica, copy snapshots]
  applies_to: all
- id: protection.image_level_backup
  name: Image-level backup
  definition: Backups of whole machines, instances or disks written in the backup product's own format.
  aliases: [image-level backup, image-based backup, full machine backup, vm backup, instance backup, block-level backup]
  applies_to: all
- id: protection.cloud_native_backup_service
  name: Backup through the provider's backup service
  definition: Protection delegated to the cloud provider's native backup service or vault.
  aliases: [aws backup integration, native backup vault, cloud-native backup, provider backup service, backup vault, microsoft 365 backup storage]
  applies_to: [cloud, saas]
- id: protection.agent_based
  name: Agent-based protection
  definition: Protection that requires installing an agent in the guest or on the host.
  aliases: [agent, backup agent, agent-based backup, install agent, guest agent]
  applies_to: all
- id: protection.agentless
  name: Agentless protection
  definition: Protection without installing software inside the protected workload.
  aliases: [agentless, agentless backup, without agent, no agent required]
  applies_to: all
- id: protection.application_consistent
  name: Application-consistent backup
  definition: Backups that quiesce applications so their data is consistent on restore.
  aliases: [application-consistent, app-consistent, application-aware processing, vss, quiesce, crash-consistent, freeze and thaw, pre and post scripts]
  applies_to: all
- id: protection.changed_block_tracking
  name: Changed block tracking
  definition: Reading only changed blocks for incremental backups or restores.
  aliases: [changed block tracking, cbt, incremental forever, change tracking, resilient change tracking, block-level incremental]
  applies_to: all
- id: protection.log_backup
  name: Transaction log backup
  definition: Backing up and optionally truncating database or application logs.
  aliases: [log backup, transaction log backup, log shipping, archive log backup, wal backup, log truncation]
  applies_to: [app, cloud.database]
- id: protection.backup_copy
  name: Secondary backup copy
  definition: Copying backups to a second location or storage technology under separate retention.
  aliases: [backup copy, secondary copy, copy job, 3-2-1, offsite copy, second copy, auxiliary copy]
  applies_to: all
- id: protection.replication
  name: Replication
  definition: Keeping a ready-to-start copy of a workload on another host, site or cloud.
  aliases: [replication, replica, vm replication, standby copy, live sync]
  applies_to: all
- id: protection.continuous_data_protection
  name: Continuous data protection
  definition: Journal-based replication or backup with recovery points seconds apart.
  aliases: [cdp, continuous data protection, journal-based replication, near-synchronous replication]
  applies_to: all
- id: protection.storage_array_integration
  name: Storage array snapshot integration
  definition: Using primary storage array snapshots for backup or recovery.
  aliases: [storage snapshot, array snapshot, backup from storage snapshot, hardware snapshot, intellisnap, storage integration, csi snapshot, csi driver]
  applies_to: [virtualization, app, file, kubernetes]
- id: protection.discovery_auto_protection
  name: Automatic discovery and protection of new objects
  definition: Discovering new workloads, users or objects and adding them to protection by policy, label or group.
  aliases: [auto-discovery, automatic protection, dynamic groups, auto-protect, label selector, tag-based protection, new users automatically protected]
  applies_to: all
- id: protection.cross_account_backup
  name: Backups in a separate account or region
  definition: Storing backups in a cloud account, subscription or region separate from the source workload.
  aliases: [cross-account backup, cross-region backup, backup to another account, backup to another subscription, separate backup account]
  applies_to: [cloud]
- id: protection.api_throttling
  name: Throttling against provider API limits
  definition: Controls that keep backups within a SaaS or cloud provider's API limits.
  aliases: [api throttling, api limits, api usage, rate limiting, bulk api, throttling]
  applies_to: [saas, cloud]
# ---------------- schedule ----------------
- id: schedule.minimum_rpo
  name: Minimum backup interval (RPO)
  definition: The shortest supported interval between backups or recovery points.
  aliases: [rpo, backup frequency, minimum backup interval, backup every, as often as, recovery point objective]
  applies_to: all
  value_unit: minutes
- id: schedule.types
  name: Schedule options
  definition: The schedule types available, such as hourly, daily, weekly, monthly, yearly or continuous.
  aliases: [schedule, backup schedule, hourly backup, daily backup, scheduling options, backup window]
  applies_to: all
- id: schedule.on_demand
  name: On-demand backup
  definition: Starting a backup manually outside the schedule.
  aliases: [on-demand backup, manual backup, backup now, ad hoc backup]
  applies_to: all
- id: schedule.per_object_policy
  name: Per-object or per-group policies
  definition: Different schedules or retention for different objects, users or groups within one tenant or source.
  aliases: [per-object schedule, per-group policy, multiple backup policies, object-level schedule, separate policies]
  applies_to: all
- id: schedule.sla_based_policy
  name: SLA-based policies
  definition: Policies defined by a target service level rather than an explicit schedule.
  aliases: [sla-based policy, sla domain, protection sla, sla policy]
  applies_to: all
# ---------------- retention ----------------
- id: retention.maximum_period
  name: Maximum retention period
  definition: The longest retention period the product supports.
  aliases: [maximum retention, retention up to, unlimited retention, retain forever, keep forever, retention period]
  applies_to: all
  value_unit: years
- id: retention.granularity
  name: Retention granularity
  definition: The units and options for setting retention, such as days, restore points, or GFS.
  aliases: [retention options, retention settings, restore points to keep, retention policy, gfs, grandfather-father-son]
  applies_to: all
- id: retention.per_object
  name: Per-object retention
  definition: Different retention periods for different objects or data types within one source.
  aliases: [object-level retention, per-object retention, retention per object type, item-level retention]
  applies_to: all
- id: retention.default_period
  name: Default retention period
  definition: The retention period applied when none is configured.
  aliases: [default retention]
  applies_to: all
  value_unit: days
# ---------------- storage ----------------
- id: storage.deployment_model
  name: Deployment model
  definition: Whether the product is delivered as SaaS, self-managed software, a hosted or MSP service, or a combination.
  aliases: [saas, software as a service, self-managed, self-hosted, on-premises deployment, managed service, deployment options, msp]
  applies_to: all
  platform: true
- id: storage.bring_your_own_storage
  name: Customer-owned backup storage
  definition: Whether backups can be kept in the customer's own storage or cloud account.
  aliases: [byos, bring your own storage, customer-owned storage, own storage account, customer storage]
  applies_to: all
- id: storage.cloud_provider_choice
  name: Choice of storage cloud
  definition: Which cloud providers can hold the backups.
  aliases: [storage cloud choice, aws or azure, choice of cloud provider, storage provider]
  applies_to: all
- id: storage.region_choice
  name: Backup storage regions
  definition: How many and which regions backups can be stored in.
  aliases: [backup region, data residency, storage location, data center location, region selection, storage region, data location]
  applies_to: all
  value_unit: regions
- id: storage.location_change
  name: Changing backup location after setup
  definition: Whether the backup storage location can be changed once protection is configured.
  aliases: [change backup location, change region, migrate backup location, move backups to another region]
  applies_to: all
- id: storage.multi_geo
  name: Multi-geo support
  definition: Mapping workloads in several geographies to matching backup regions.
  aliases: [multi-geo, region mapping, multi-geo tenants]
  applies_to: [saas]
- id: storage.redundancy
  name: Storage redundancy
  definition: The redundancy of the backup storage, such as locally, zone or geo-redundant copies.
  aliases: [lrs, zrs, grs, geo-redundant, zone-redundant, locally redundant, storage redundancy, paired region]
  applies_to: all
- id: storage.tiers
  name: Storage tiers
  definition: Storage classes available for backups, including hot, cool, cold and archive tiers.
  aliases: [storage tier, archive tier, cool tier, cold storage, glacier, hot tier, archive storage]
  applies_to: all
- id: storage.tiering
  name: Automatic tiering
  definition: Policy-driven movement of backups between storage tiers.
  aliases: [tiering, automatic tiering, move to archive, capacity tier, data movement between tiers, lifecycle policy]
  applies_to: all
- id: storage.data_reduction
  name: Data reduction
  definition: Compression and deduplication, including where and at what scope deduplication runs.
  aliases: [deduplication, compression, global deduplication, source-side deduplication, data reduction, dedup]
  applies_to: all
- id: storage.repository_types
  name: Backup repository types
  definition: The kinds of storage that can hold backups, such as disk, NAS, object storage or deduplication appliances.
  aliases: [backup repository, backup target, storage target, repository types, supported storage, backup destination]
  applies_to: all
- id: storage.scale_out
  name: Scale-out repositories
  definition: Grouping several storage extents into one logical repository with placement and maintenance options.
  aliases: [scale-out backup repository, sobr, storage pool, extents, scale-out storage]
  applies_to: all
- id: storage.tape
  name: Tape support
  definition: Writing backups to physical or virtual tape, including WORM media.
  aliases: [tape, lto, tape library, virtual tape library, worm tape, tape out]
  applies_to: all
- id: storage.portable_format
  name: Self-contained backup format
  definition: Whether backup files carry their own metadata and can be restored without the original catalog or server.
  aliases: [portable backups, self-contained backup files, independent of catalog, data portability]
  applies_to: all
- id: storage.durability
  name: Storage durability commitment
  definition: The stated durability of stored backups.
  aliases: [durability, nines of durability, data durability]
  applies_to: all
- id: storage.availability_sla
  name: Service availability commitment
  definition: The stated uptime commitment of the service.
  aliases: [availability sla, uptime sla, service level agreement, uptime]
  applies_to: all
  platform: true
- id: storage.sovereign_cloud
  name: Government and sovereign clouds
  definition: Support for government or sovereign cloud regions.
  aliases: [govcloud, government cloud, sovereign cloud, azure government, fedramp region]
  applies_to: all
- id: storage.egress_terms
  name: Restore and egress allowance
  definition: Included restore or egress volume and how it is counted.
  aliases: [egress, egress fees, restore allowance, data retrieval]
  applies_to: all
- id: storage.capacity_scaling
  name: Capacity and scaling limits
  definition: Documented size limits, node counts and scaling steps of the backup storage or platform.
  aliases: [capacity, usable capacity, scale-out nodes, maximum nodes, cluster size, scaling]
  applies_to: all
# ---------------- recovery ----------------
- id: recovery.granularity
  name: Recovery granularity
  definition: The levels at which data can be restored, from a whole tenant or machine down to an item, attribute or field.
  aliases: [granular recovery, item-level recovery, file-level recovery, recovery granularity, attribute-level restore, field-level restore]
  applies_to: all
- id: recovery.in_place
  name: Restore to original location
  definition: Restoring data back to where it came from.
  aliases: [restore to original location, in-place restore, overwrite, original location]
  applies_to: all
- id: recovery.alternate_location
  name: Restore to another location
  definition: Restoring data to a different object, folder, host, site or account.
  aliases: [restore to alternate location, alternate location, different location, restore to another, out-of-place restore]
  applies_to: all
- id: recovery.cross_account_region
  name: Cross-account and cross-region recovery
  definition: Restoring to another cloud account, subscription or region.
  aliases: [cross-account restore, cross-region restore, restore to another subscription, restore to another region]
  applies_to: [cloud]
- id: recovery.cross_tenant
  name: Cross-tenant or cross-org recovery
  definition: Restoring data into a different tenant or organization than the source.
  aliases: [cross-tenant restore, cross-org restore, restore to another tenant, tenant to tenant, restore to sandbox]
  applies_to: [saas]
- id: recovery.full_tenant
  name: Full tenant recovery
  definition: Restoring an entire tenant, organization or account in one operation.
  aliases: [full tenant restore, tenant recovery, entire org restore, full org recovery]
  applies_to: [saas]
- id: recovery.cross_platform
  name: Cross-platform recovery
  definition: Restoring a workload to a different hypervisor, cloud or physical platform.
  aliases: [cross-platform restore, restore to cloud, v2v, p2v, restore to another hypervisor, migration restore, restore to azure, restore to aws]
  applies_to: [virtualization, cloud.compute, endpoint, kubernetes]
- id: recovery.instant
  name: Instant recovery
  definition: Running a workload directly from backup storage before data is fully restored.
  aliases: [instant recovery, instant vm recovery, live mount, instant restore, run from backup, instant access]
  applies_to: all
- id: recovery.instant_database
  name: Instant database recovery
  definition: Starting a database directly from backup and switching over later.
  aliases: [instant database recovery, database live mount, instant db restore]
  applies_to: [app.database, cloud.database]
- id: recovery.bulk
  name: Bulk recovery
  definition: Restoring many users, objects or machines in one job, with any stated limits.
  aliases: [bulk restore, mass restore, restore multiple, batch restore]
  applies_to: all
- id: recovery.point_in_time
  name: Point-in-time recovery
  definition: Restoring to an arbitrary moment rather than only to a backup point.
  aliases: [point-in-time recovery, pitr, point in time restore, rollback to point in time]
  applies_to: all
- id: recovery.changes_only
  name: Restore only changed or deleted items
  definition: Restoring just the items changed or deleted since a restore point, leaving the rest untouched.
  aliases: [restore changed items only, rollback changes, restore deleted items only, undo changes]
  applies_to: all
- id: recovery.relationships
  name: Relationship and hierarchy restore
  definition: Restoring related objects, memberships or parent-child hierarchies together.
  aliases: [relationship restore, hierarchy restore, parent-child restore, restore memberships, restore dependencies]
  applies_to: [saas, app.directory]
- id: recovery.conflict_handling
  name: Restore conflict handling
  definition: Options for what happens when restored data meets existing data, such as skip, overwrite or keep both.
  aliases: [skip or overwrite, overwrite mode, conflict resolution, keep both, restore mode]
  applies_to: all
- id: recovery.automation_bypass
  name: Bypassing target-side automation on restore
  definition: Disabling triggers, flows, validation rules or similar automation during a restore.
  aliases: [bypass triggers, disable validation rules, bypass flows, disable automation during restore]
  applies_to: [saas.crm]
- id: recovery.password_options
  name: Password handling on identity restore
  definition: How passwords are set for restored accounts.
  aliases: [password reset, temporary password, default password, change password at next logon]
  applies_to: [saas.identity, app.directory]
- id: recovery.recycle_bin
  name: Restore from recycle bin
  definition: Recovering soft-deleted objects from the source system's recycle bin.
  aliases: [recycle bin, soft-deleted objects, restore from recycle bin]
  applies_to: [saas, app.directory]
- id: recovery.hybrid_identity
  name: Hybrid identity recovery
  definition: Protecting and recovering on-premises directory and cloud identity together.
  aliases: [hybrid active directory, hybrid identity, ad and entra id, on-premises and cloud identity]
  applies_to: [saas.identity, app.directory]
- id: recovery.export_formats
  name: Export formats
  definition: The file formats data can be exported or downloaded in.
  aliases: [pst export, csv export, export format, zip download, msg, eml]
  applies_to: all
- id: recovery.preview
  name: Preview before restore
  definition: Viewing backed-up content before restoring it.
  aliases: [preview, view before restore, browse backup, open item from backup]
  applies_to: all
- id: recovery.comparison_tooling
  name: Comparison tooling
  definition: How comparisons between restore points or against production work, such as highlighting and multi-object support.
  aliases: [comparison wizard, compare tool, show changes only, side-by-side comparison, change highlighting]
  applies_to: all
- id: recovery.search_scope
  name: Search scope
  definition: Whether search spans many users, sites or sources at once, or works within one at a time.
  aliases: [search across users, global search, cross-mailbox search, centralized search, search scope]
  applies_to: all
- id: recovery.search_filters
  name: Search filters
  definition: The filters and query operators available when searching backups.
  aliases: [search filters, advanced search, filter fields, search criteria, and/or/not]
  applies_to: all
- id: recovery.file_indexing
  name: File indexing
  definition: Indexing backed-up file systems so files can be found without mounting backups.
  aliases: [file indexing, catalog, index files, guest file indexing, search index]
  applies_to: all
- id: recovery.self_service
  name: Self-service restore
  definition: Letting end users or delegated operators restore their own data, and for which workloads.
  aliases: [self-service restore, end-user restore, self-service portal, delegated restore, restore operator]
  applies_to: all
- id: recovery.staged
  name: Staged restore
  definition: Running scripts or checks on restored data in isolation before it reaches production.
  aliases: [staged restore, staged recovery, run script before restore]
  applies_to: [virtualization]
- id: recovery.limits
  name: Restore limits
  definition: Documented limits on restore jobs, such as items per job or size per restore.
  aliases: [restore limit, maximum records per restore, restore job limit, items per restore]
  applies_to: all
  value_unit: items per job
- id: recovery.bare_metal
  name: Bare-metal recovery
  definition: Restoring a physical machine onto new or dissimilar hardware.
  aliases: [bare metal recovery, bmr, dissimilar hardware restore, recovery media]
  applies_to: [endpoint]
- id: recovery.failover
  name: Failover and failback
  definition: Switching to replicas and back, including planned and test failovers.
  aliases: [failover, failback, planned failover, test failover, failover plan]
  applies_to: all
- id: recovery.network_settings
  name: Network identity preservation on restore
  definition: Preserving or remapping network identity such as MAC or IP addresses on restore.
  aliases: [preserve mac address, ip remapping, network mapping, re-ip]
  applies_to: [virtualization, kubernetes.vm, cloud.compute]
- id: recovery.resource_transforms
  name: Resource transformation on restore
  definition: Modifying resource definitions or manifests during restore.
  aliases: [transforms, resource modifiers, manifest transformation, restore transforms]
  applies_to: [kubernetes]
# ---------------- security ----------------
- id: security.immutability
