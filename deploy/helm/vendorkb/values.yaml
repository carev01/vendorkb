# No credential belongs in this file. Credentials live in the out-of-band secret
# named below (see docs/deploy/k3s.md).
image:
  repository: ghcr.io/carev01/vendorkb
  tag: ""            # required: sha-<7-char commit>
  pullPolicy: IfNotPresent

imagePullSecrets: []   # e.g. [{name: ghcr-pull}] when the GHCR package is private

# Secret keys: POSTGRES_PASSWORD (hex), EMBED_API_KEY, RERANK_API_KEY, JUDGE_API_KEY,
# DOCEXT_READ_KEY.
secretName: vendorkb-secret

# Non-secret settings (VendorkbSettings env vars); applied AFTER the secret, so these win.
config:
  DOCEXT_BASE_URL: http://docextractor-backend.docextractor.svc:8000
  DOCEXT_VERIFY_TLS: "false"
  EMBED_BASE_URL: https://api.voyageai.com/v1
  EMBED_MODEL: voyage-4
  EMBED_DIM: "1024"
  RERANK_BASE_URL: https://api.voyageai.com/v1
  RERANK_MODEL: rerank-3
  JUDGE_BASE_URL: https://openrouter.ai/api/v1
  TOPIC_GRID: "false"   # the "which vendors" topic grid (precision bounded by the facts')

postgres:
  image: pgvector/pgvector:pg16
  storageClass: vsphere-csi-silver-sc
  size: 20Gi
  database: vendorkb
  user: vendorkb
  fsGroup: 999   # the Debian postgres uid (alpine's is 70)
  shmSize: 1Gi   # memory-backed /dev/shm: parallel HNSW builds outgrow the 64 MB default
  resources:     # HNSW index builds need memory; shared_buffers below must fit inside the limit
    requests: {cpu: 250m, memory: 2Gi}
    limits: {cpu: "2", memory: 6Gi}
  # postgres -c settings. The 128MB default cache is far below the 3.6 GB chunks table and the
  # 1.8 GB HNSW index (measured 2026-11-05): every search re-read them from the page cache.
  settings:
    shared_buffers: 1536MB
    effective_cache_size: 4GB
    work_mem: 16MB
  # pg_hba.conf. A `kubectl port-forward` connection arrives from 127.0.0.1 inside the pod, where
  # the image's default pg_hba.conf trusts it (no password). Here only the unix socket is
  # trusted (reaching it needs `kubectl exec`, a stronger permission); every TCP connection,
  # port-forward included, must present the password.
  hba: |
    local all all trust
    host  all all all scram-sha-256

sync:
  schedule: "*/30 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  # --max-tokens per run. In incremental mode it caps this run's embedding tokens; if the
  # bootstrap has not finished it caps the bootstrap's running total instead, so the
  # CronJob can never continue a bootstrap past it. Required: rendering fails when empty or <= 0.
  maxTokens: 5000000
  activeDeadlineSeconds: 21600
  backoffLimit: 0
  command: ["vendorkb", "sync"]
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}

# One-off bootstrap Job. Each retry resumes from bootstrap_after, so backoffLimit is how
# a dropped feed recovers (sync exits 1 on a dropped stream).
bootstrap:
  enabled: false
  # Cumulative across every attempt, retry and Job of this bootstrap (sync_state
  # bootstrap_tokens), smoke run included; not per pod.
  maxTokens: 85000000
  # --allow-prune N: lets the bootstrap's end prune up to N documents above the safety
  # ceiling (max(500, 2% of documents)). Set only after checking the refused count in the
  # Job log.
  allowPrune: null
  activeDeadlineSeconds: 43200
  backoffLimit: 6
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}

# Reactive claims refresh (`vendorkb refresh`, src/vendorkb/claims/refresh.py). Each run is a
# couple of queries until the sync brings chunks no extraction has touched; then, once the feed
# has been quiet for settleMinutes, it wakes the distilled extractor (deploy/azure, scaled to
# zero), extracts, maps the new claims and rebuilds capabilities.
# Secret keys it needs: EXTRACT_API_KEY (the endpoint's key), MAP_API_KEY (map.backend
# openai: OpenRouter) or ANTHROPIC_API_KEY (map.backend anthropic), and ANTHROPIC_API_KEY for
# support.backend anthropic.
claimsRefresh:
  enabled: false
  schedule: "45 3 * * 0"   # weekly, Sunday 03:45 (between sync runs)
  suspend: false
  settleMinutes: 60
  startingDeadlineSeconds: 1800
  activeDeadlineSeconds: 21600
  backoffLimit: 0
  extract:
    baseUrl: ""            # required when enabled: https://<app>.<region>.azurecontainerapps.io/v1
    model: vendorkb-qwen3.5-9b-r2
    maxTokens: 8000        # the corpus run's limit; a cut-off chunk is retried, then failed
    concurrency: 32
    limit: 20000           # chunks per run; a backlog this large runs without settling
    warmupSeconds: 1500    # how long to wait for the scaled-to-zero endpoint
  map:
    backend: openai        # openai: OpenRouter (MAP_API_KEY); anthropic: ANTHROPIC_API_KEY
    baseUrl: https://openrouter.ai/api/v1
    model: anthropic/claude-haiku-5.5
    maxUsd: 1.0            # per due run; claims left over wait for the next one
  # The claim support check (src/vendorkb/claims/support.py): the checker asks each new claim
  # of a topic dimension, the reviewer re-asks every claim it flags; capabilities leave out
  # only the claims the reviewer rejects. backend anthropic needs ANTHROPIC_API_KEY in the
  # secret; openai uses MAP_BASE_URL / MAP_API_KEY (then use the OpenRouter model ids).
  # Calibration: docs/superpowers/specs/2026-11-09-claim-support-check-design.md.
  support:
    backend: anthropic
    model: claude-haiku-5-5
    effort: high
    reviewModel: claude-opus-5-5
    reviewEffort: low
    maxUsd: 1.0            # checker, per due run
    reviewMaxUsd: 1.0      # reviewer, per due run
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {cpu: "2", memory: 4Gi}

# The MCP server for the downstream agent (src/vendorkb/mcp_app.py). Secret key it needs:
# MCP_BEARER_TOKEN (every request carries it as `Authorization: Bearer <token>`); tools also use
# EMBED/RERANK (search) and JUDGE (answer_question) keys already in the secret.
mcp:
  enabled: false
  replicas: 1
  # Host headers the server answers (DNS-rebinding guard): the in-cluster service names and the
  # ingress host. "host:*" allows any port.
  allowedHosts: "vendorkb-mcp,vendorkb-mcp:*,vendorkb-mcp.vendorkb.svc,vendorkb-mcp.vendorkb.svc:*,vendorkb-mcp.vendorkb.svc.cluster.local:*,vendorkb-mcp.k3s.home.lan"
  ingress:
    enabled: false
    className: traefik
    host: ""               # e.g. vendorkb-mcp.k3s.home.lan (add it to allowedHosts)
    tlsSecret: ""
    annotations: {}
  # The public route for Copilot Studio: only /mcp, at a Cloudflare-proxied host; the host is
  # added to allowedHosts. TLS: a copy of DocExtractor's Cloudflare Origin CA secret
  # (docs/deploy/copilot-studio.md).
  publicIngress:
    enabled: false
    className: traefik
    host: ""               # vendorkb.area51.pp.ua
    tlsSecret: ""          # cloudflare-origin-ca
    annotations: {traefik.ingress.kubernetes.io/router.entrypoints: websecure}
    # Traefik rate limits (requests per period; burst = extra requests allowed at once):
    # - client: per Cloudflare client IP (CF-Connecting-IP);
    # - global: one bucket for the host, which bounds total spend.
    # Copilot Studio calls come from a few Microsoft addresses, so `client` mostly acts on
    # anything else.
    rateLimit:
      enabled: true
      client: {average: 30, period: 1m, burst: 20}
      global: {average: 120, period: 1m, burst: 60}
  resources:   # queries are bounded in SQL; 2Gi leaves room for concurrent tool calls
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
