{{- if .Values.mcp.enabled }}
{{- $m := .Values.mcp }}
# The MCP server (`vendorkb mcp`, src/vendorkb/mcp_app.py): streamable HTTP at /mcp behind
# the MCP_BEARER_TOKEN secret key (the server refuses to start without it), /healthz for probes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vendorkb-mcp
  labels: {{- include "vendorkb.labels" . | nindent 4 }}
spec:
  replicas: {{ $m.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: vendorkb-mcp}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vendorkb-mcp
        {{- include "vendorkb.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "vendorkb.pullSecrets" . | nindent 6 }}
      {{- include "vendorkb.podSecurity" . | nindent 6 }}
      containers:
        - name: mcp
          image: {{ include "vendorkb.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["vendorkb", "mcp", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - {name: http, containerPort: 8080}
          {{- include "vendorkb.env" . | nindent 10 }}
            - name: MCP_ALLOWED_HOSTS
              {{- if $m.publicIngress.enabled }}
              value: {{ printf "%s,%s" $m.allowedHosts (required "mcp.publicIngress.host is required when the public ingress is enabled" $m.publicIngress.host) | quote }}
              {{- else }}
              value: {{ $m.allowedHosts | quote }}
              {{- end }}
          {{- include "vendorkb.envFrom" . | nindent 10 }}
          {{- include "vendorkb.containerSecurity" . | nindent 10 }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            failureThreshold: 5
          resources: {{- toYaml $m.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: vendorkb-mcp
  labels: {{- include "vendorkb.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: vendorkb-mcp}
  ports:
    - {name: http, port: 8080, targetPort: http}
{{- if $m.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vendorkb-mcp
  labels: {{- include "vendorkb.labels" . | nindent 4 }}
  {{- with $m.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $m.ingress.className }}
  rules:
    - host: {{ required "mcp.ingress.host is required when the ingress is enabled" $m.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: vendorkb-mcp, port: {number: 8080}}
  {{- with $m.ingress.tlsSecret }}
  tls:
    - hosts: [{{ $m.ingress.host | quote }}]
      secretName: {{ . }}
  {{- end }}
{{- end }}
{{- if $m.publicIngress.enabled }}
---
# The public route for Copilot Studio (docs/deploy/copilot-studio.md): only /mcp, TLS from the
# Cloudflare Origin CA certificate; Cloudflare proxies the host (no WAF rules on the free plan).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vendorkb-mcp-public
  labels: {{- include "vendorkb.labels" . | nindent 4 }}
  {{- with $m.publicIngress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $m.publicIngress.className }}
  rules:
    - host: {{ $m.publicIngress.host | quote }}
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend:
              service: {name: vendorkb-mcp, port: {number: 8080}}
  tls:
    - hosts: [{{ $m.publicIngress.host | quote }}]
      secretName: {{ required "mcp.publicIngress.tlsSecret is required when the public ingress is enabled" $m.publicIngress.tlsSecret }}
{{- end }}
{{- end }}
