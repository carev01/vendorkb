apiVersion: v1
kind: Service
metadata:
  name: vendorkb-postgres
  labels: {{- include "vendorkb.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {app: vendorkb-postgres}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vendorkb-postgres-hba
  labels: {{- include "vendorkb.labels" . | nindent 4 }}
data:
  pg_hba.conf: |
    {{- .Values.postgres.hba | trim | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vendorkb-postgres
  labels: {{- include "vendorkb.labels" . | nindent 4 }}
spec:
  serviceName: vendorkb-postgres
  replicas: 1
  selector:
    matchLabels: {app: vendorkb-postgres}
  template:
    metadata:
      labels: {app: vendorkb-postgres}
      annotations:
        checksum/pg-hba: {{ .Values.postgres.hba | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: {{ .Values.postgres.fsGroup }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          args:
            - "-c"
            - "hba_file=/etc/vendorkb-pg/pg_hba.conf"
            {{- range $k, $v := .Values.postgres.settings }}
            - "-c"
            - {{ printf "%s=%v" $k $v | quote }}
            {{- end }}
          ports: [{containerPort: 5432, name: postgres}]
          env:
            - {name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: POSTGRES_PASSWORD}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: ["pg_isready", "-h", "127.0.0.1", "-U", {{ .Values.postgres.user | quote }}]}
            periodSeconds: 10
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: dshm, mountPath: /dev/shm}
            - {name: hba, mountPath: /etc/vendorkb-pg, readOnly: true}
      volumes:
        - name: hba
          configMap: {name: vendorkb-postgres-hba}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: {{ .Values.postgres.shmSize }}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.postgres.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgres.size }}
