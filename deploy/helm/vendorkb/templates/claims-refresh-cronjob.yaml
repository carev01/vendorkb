{{- if .Values.claimsRefresh.enabled }}
{{- $c := .Values.claimsRefresh }}
{{- $vast := $c.extract.vast.endpoint }}
{{- if not (or $vast $c.extract.baseUrl) }}
{{- fail "claimsRefresh.extract.vast.endpoint (deploy/vast) or claimsRefresh.extract.baseUrl (an OpenAI-compatible endpoint ending in /v1) is required" }}
{{- end }}
{{- if and $vast (not $c.extract.vast.searchParams) }}
{{- fail "claimsRefresh.extract.vast.searchParams is required with vast.endpoint (deploy/vast/endpoint.env)" }}
{{- end }}
{{- if and $c.batch (or (ne $c.map.backend "anthropic") (ne $c.support.backend "anthropic")) }}
{{- fail "claimsRefresh.batch needs map.backend and support.backend anthropic (the Message Batches API)" }}
{{- end }}
{{- $jobs := list (dict "name" "vendorkb-claims-refresh" "schedule" $c.schedule "args" (list)) }}
{{- if $c.batch }}
{{- $jobs = append $jobs (dict "name" "vendorkb-claims-collect" "schedule" $c.collect.schedule "args" (list "--no-extract")) }}
{{- end }}
{{- range $job := $jobs }}
# `vendorkb refresh` (src/vendorkb/claims/refresh.py). vendorkb-claims-refresh contacts nothing
# until the sync has brought chunks no extraction has touched, then wakes the scaled-to-zero
# extraction endpoint once per burst, extracts them, maps and support-checks their claims and
# rebuilds capabilities. With claimsRefresh.batch, map and support run on the Message Batches
# API, one round per run, and vendorkb-claims-collect (often, --no-extract: it never wakes the
# GPU) carries the open batches on until the facts are published.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $job.name }}
  labels: {{- include "vendorkb.labels" $ | nindent 4 }}
spec:
  schedule: {{ $job.schedule | quote }}
  suspend: {{ $c.suspend }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ $c.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: {{ $c.backoffLimit }}
      activeDeadlineSeconds: {{ $c.activeDeadlineSeconds }}
      template:
        metadata:
          annotations:
            checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        spec:
          restartPolicy: Never
          {{- include "vendorkb.pullSecrets" $ | nindent 10 }}
          {{- include "vendorkb.podSecurity" $ | nindent 10 }}
          containers:
            - name: {{ trimPrefix "vendorkb-" $job.name }}
              image: {{ include "vendorkb.image" $ }}
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              command:
                - vendorkb
                - refresh
                - --settle-minutes
                - {{ $c.settleMinutes | quote }}
                - --extract-limit
                - {{ $c.extract.limit | quote }}
                - --map-max-usd
                - {{ $c.map.maxUsd | quote }}
                - --warmup-seconds
                - {{ $c.extract.warmupSeconds | quote }}
                - --support-max-usd
                - {{ $c.support.maxUsd | quote }}
                - --support-review-max-usd
                - {{ $c.support.reviewMaxUsd | quote }}
                {{- if $c.batch }}
                - --batch
                {{- end }}
                {{- range $job.args }}
                - {{ . }}
                {{- end }}
              {{- include "vendorkb.env" $ | nindent 14 }}
                # These win over the shared ConfigMap and secret (env beats envFrom).
                - {name: EXTRACT_BACKEND, value: openai}
                {{- if $vast }}
                # the proxy URL and the Vast key (VAST_API_KEY, in the secret) as the
                # extraction endpoint; wake replaces failing workers (claims/vast.py)
                - {name: VAST_ENDPOINT, value: {{ $vast | quote }}}
                - {name: VAST_SEARCH_PARAMS, value: {{ $c.extract.vast.searchParams | quote }}}
                - {name: VAST_WORKER_READY_S, value: {{ $c.extract.vast.workerReadySeconds | quote }}}
                {{- else }}
                - {name: EXTRACT_BASE_URL, value: {{ $c.extract.baseUrl | quote }}}
                {{- end }}
                - {name: EXTRACT_MODEL, value: {{ $c.extract.model | quote }}}
                - {name: EXTRACT_MAX_TOKENS, value: {{ $c.extract.maxTokens | quote }}}
                - {name: EXTRACT_EFFORT, value: low}
                - {name: EXTRACT_CONCURRENCY, value: {{ $c.extract.concurrency | quote }}}
                # GPU time is billed by the GPU host (Vast), not per token: nominal prices keep the
                # extraction ledger (real API spend) at zero.
                - {name: EXTRACT_PRICE_IN_PER_MTOK, value: "0.000001"}
                - {name: EXTRACT_PRICE_OUT_PER_MTOK, value: "0.000001"}
                - {name: MAP_BACKEND, value: {{ $c.map.backend | quote }}}
                - {name: MAP_BASE_URL, value: {{ $c.map.baseUrl | quote }}}
                - {name: MAP_MODEL, value: {{ $c.map.model | quote }}}
                - {name: SUPPORT_BACKEND, value: {{ $c.support.backend | quote }}}
                - {name: SUPPORT_MODEL, value: {{ $c.support.model | quote }}}
                - {name: SUPPORT_EFFORT, value: {{ $c.support.effort | quote }}}
                - {name: SUPPORT_REVIEW_MODEL, value: {{ $c.support.reviewModel | quote }}}
                - {name: SUPPORT_REVIEW_EFFORT, value: {{ $c.support.reviewEffort | quote }}}
              {{- include "vendorkb.envFrom" $ | nindent 14 }}
              {{- include "vendorkb.containerSecurity" $ | nindent 14 }}
              resources: {{- toYaml $c.resources | nindent 16 }}
{{- end }}
{{- end }}
