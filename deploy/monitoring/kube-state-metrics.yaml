# kube-state-metrics for the vendorkb namespace only: CronJob, Job, Pod, Deployment, StatefulSet
# and PVC state (failed Jobs, their start times) for the vendorkb dashboard. Applied by apply.py.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels: {app.kubernetes.io/name: kube-state-metrics, app.kubernetes.io/part-of: llm-monitoring}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
  labels: {app.kubernetes.io/name: kube-state-metrics, app.kubernetes.io/part-of: llm-monitoring}
rules:
  - apiGroups: ["batch"]
    resources: [cronjobs, jobs]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
  labels: {app.kubernetes.io/name: kube-state-metrics, app.kubernetes.io/part-of: llm-monitoring}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels: {app.kubernetes.io/name: kube-state-metrics, app.kubernetes.io/part-of: llm-monitoring}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kube-state-metrics}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kube-state-metrics}
    spec:
      serviceAccountName: kube-state-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.15.0
          args:
            - --resources=cronjobs,jobs,pods,deployments,statefulsets,persistentvolumeclaims
            - --namespaces=vendorkb
          ports:
            - {name: http-metrics, containerPort: 8080}
            - {name: telemetry, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /livez, port: http-metrics}
            initialDelaySeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: telemetry}
            initialDelaySeconds: 5
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels: {app.kubernetes.io/name: kube-state-metrics, app.kubernetes.io/part-of: llm-monitoring}
spec:
  selector: {app.kubernetes.io/name: kube-state-metrics}
  ports:
    - {name: http-metrics, port: 8080, targetPort: http-metrics}
